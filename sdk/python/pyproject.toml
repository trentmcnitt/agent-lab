[project]
name = "agentlab"
dynamic = ["version"]
description = "Agent Lab's Python library: an app's structure, facts and words on OpenTelemetry, verified against its code."
readme = "README.md"
license = "FSL-1.1-ALv2"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<1.3", "langchain-core>=1.6"]
agentspec = ["pyyaml"]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8",
    "langgraph>=1.2,<1.3",      # the [langgraph] extra, so the integration tests run
    "langchain-core>=1.6",
    "langgraph-checkpoint-sqlite>=3",
    "pyyaml",                   # the [agentspec] extra, so the Agent Spec tests run
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agentlab/version.py"

[tool.hatch.build.targets.wheel]
packages = ["agentlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
