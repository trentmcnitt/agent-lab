[project]
name = "agentlab-agent-loop"
version = "0.1.0"
description = "Agent Lab example: one LangGraph step that runs an agent loop (several model and tool calls, two at once), with a scripted model (no API key)."
requires-python = ">=3.11"
dependencies = ["agentlab[langgraph]"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
agentlab = { path = "../../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["."]
