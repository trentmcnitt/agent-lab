<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Agent Lab · bench</title>
<style>
  /* The bench pane's type: Geist and Geist Mono, served with the viewer (offline). */
  @font-face { font-family: "Geist"; src: local("Geist"), url("../viewer/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: local("Geist Mono"), url("../viewer/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  /* The bench's S4 palette (viewer/index.html), so the bar and the pane read as one product. */
  :root { color-scheme: dark; --bg: #07080B; --panel: #0A0B0F; --surface: #0E1015; --surface-2: #13161D; --border: #232731; --border-2: #2F3441;
          --text: #EDEFF3; --text-2: #AEB4C0; --text-3: #7E8697; --path: #3EF0C8; --accent: var(--path);
          --sans: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.35 var(--sans); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  /* The bar: chrome above the two panes, a notch quieter than the bench's own header under it. */
  .bar { flex: none; display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px 0 14px; background: linear-gradient(#0B0C10, var(--panel)); border-bottom: 1px solid var(--border); min-width: 0; }
  .bar .brand { flex: none; display: flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; white-space: nowrap; padding-right: 14px; margin-right: 4px; border-right: 1px solid var(--border); height: 22px; }
  .bar .brand svg { flex: none; width: 21px; height: 21px; display: block; overflow: visible; }
  .bar .brand .nm { font: 600 14.5px/1 var(--sans); letter-spacing: -.01em; }
  .bar .brand .sub { font: 400 12px/1 var(--mono); color: var(--text-3); letter-spacing: .01em; }
  .bar a.brand[href]:hover .nm { color: #fff; }
  .bar .back { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; white-space: nowrap;
               color: var(--text-2); font: 500 13px/1 var(--sans); text-decoration: none; background: transparent; border: 1px solid var(--border-2); transition: color .15s, border-color .15s, background-color .15s; }
  .bar .back:hover { color: var(--text); border-color: color-mix(in srgb, var(--path) 55%, var(--border-2)); background: var(--surface-2); }
  .bar .back:focus-visible, .bar .brand:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
  .bar .back .ic { font-size: 12px; color: var(--text-3); }
  .bar .back .sm { display: none; }
  .bar .what { flex: none; font: 600 14.5px/1 var(--sans); letter-spacing: -.01em; white-space: nowrap; padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--border); height: 22px; display: flex; align-items: center; }
  .bar .what:empty { display: none; }
  .bar .hint { min-width: 0; display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 11px 0 10px; border-radius: 99px; white-space: nowrap; overflow: hidden;
               font: 400 12.5px/1 var(--mono); color: color-mix(in srgb, var(--path) 82%, var(--text)); background: rgba(62,240,200,.06); border: 1px solid rgba(62,240,200,.22); }
  .bar .hint[hidden] { display: none; }
  .bar .hint .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--path); box-shadow: 0 0 8px rgba(62,240,200,.8); }
  .bar .hint .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bar .spacer { flex: 1; }
  .bar .legend { flex: none; font: 400 12px/1 var(--mono); color: var(--text-3); white-space: nowrap; }
  @media (max-width: 1600px) { .bar .legend { display: none; } }
  @media (max-width: 1100px) { .bar .brand .sub { display: none; } }
  .split { flex: 1; min-height: 0; display: flex; }
  .missing { height: 100%; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; color: var(--text-3); }
  .missing b { color: var(--text); font-size: 16px; } .missing a { color: var(--accent); }
  .pane { position: relative; min-width: 0; height: 100%; }
  .pane iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  #benchPane iframe { background: var(--bg); }
  .pane .label { position: absolute; top: 6px; left: 8px; z-index: 2; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 10px; background: rgba(10,11,15,.8); color: var(--text-3); pointer-events: none; }
  /* Pill text centered in its border (cap height to baseline), line-height 1 as the fallback. */
  .pane .label { line-height: 1; }
  @supports (text-box: trim-both cap alphabetic) { .pane .label { text-box: trim-both cap alphabetic; padding-top: 4px; padding-bottom: 4px; } }
  #divider { width: 6px; cursor: col-resize; background: var(--border); flex: 0 0 auto; }
  #divider:hover, #divider.drag { background: var(--accent); }
  .dragshield { position: fixed; inset: 0; z-index: 9; cursor: col-resize; display: none; }
  body.dragging .dragshield { display: block; }
  /* Phones and narrow windows: no room for two panes, so one at a time, switched by tabs. */
  .mtabs { display: none; }
  @media (max-width: 820px) {
    .bar { flex-wrap: wrap; height: auto; row-gap: 8px; column-gap: 8px; padding: 9px 12px; }
    .bar .legend, .bar .brand .nm, .bar .brand .sub { display: none; }
    .bar .brand { padding-right: 10px; margin-right: 0; }
    .bar #home, .bar .back .lg { display: none; }   /* the mark links home */
    .bar .back .sm { display: inline; }
    .bar .spacer { display: none; }
    .bar .back { padding: 0 9px; gap: 5px; }
    .bar .what { padding-left: 2px; margin-left: 0; border-left: none; min-width: 0; flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 22px; }
    .bar .hint { order: 10; flex-basis: 100%; height: auto; min-height: 26px; padding-top: 6px; padding-bottom: 6px; white-space: normal; line-height: 1.35; border-radius: 10px; }
    .bar .hint .dot { align-self: flex-start; margin-top: 5px; }
    .mtabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel); }
    .mtabs button { flex: 1; background: none; border: none; color: var(--text-3); font: 500 14px/1 var(--sans); padding: 12px 0; border-bottom: 2px solid transparent; cursor: pointer; }
    .mtabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
    .mtabs button .pip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; visibility: hidden; }
    .mtabs button .pip.on { visibility: visible; }
    #divider { display: none; }
    #appPane, #benchPane { flex: 1 1 auto !important; }
    body.show-bench #appPane, body.show-app #benchPane { display: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <a class="brand" id="brand" aria-label="Agent Lab, on the bench"><!-- the Agent Lab mark (docs/images/agentlab-mark.svg) --><svg viewBox="0 0 64 64" aria-hidden="true"><defs><filter id="al-glow" filterUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M32 10 L54 54 L40 54 L32 36 L24 54 L10 54 Z" fill="#5eead4" fill-rule="evenodd" stroke="#5eead4" stroke-width="5" stroke-linejoin="round" filter="url(#al-glow)"/></svg><span class="nm">Agent Lab</span><span class="sub">on the bench</span></a>
  <a class="back" id="back" hidden><span class="ic">←</span><span class="lg">All scenarios</span><span class="sm">Scenarios</span></a>
  <a class="back" id="home" hidden>Home</a>
  <span class="what" id="what"></span>
  <span class="hint" id="hint" hidden><i class="dot"></i><span class="tx" id="hintTx"></span></span>
  <span class="spacer"></span>
  <span class="muted legend">left: the app · right: what the AI did (read-only)</span>
</div>
<div class="mtabs" role="tablist"><button id="tApp" class="on">The app</button><button id="tBench">The bench<span class="pip" id="pip"></span></button></div>
<div class="split">
  <div class="pane" id="appPane" style="flex: 0 0 50%"><iframe id="appFrame" title="The app"></iframe></div>
  <div id="divider" title="Drag to resize"></div>
  <div class="pane" id="benchPane" style="flex: 1 1 auto"><iframe id="benchFrame" title="The bench"></iframe></div>
</div>
<div class="dragshield"></div>
<script>
/* The shell: the app on the left, the bench on the right, one session id for both.
   Query: app=<app url> bench=<bench url, default ../> appid=<topology id> session=<id>
   sync=1 (static sites: the app's replay drives the bench by postMessage, SPEC section 3a)
   mode=presentation|engineering (passed to the bench)  back=<url> (a "← All scenarios" link)  home=<url> (a Home link; the brand links there too)  hint=<text> (what to do first, shown in the bar)
   (generated if absent).  In Agent Lab it is always side by side.  The session id is appended to the app's URL
   as bench_session=<id> so the app can stamp its events with it. */
(function () {
  var q = new URLSearchParams(location.search);
  var session = q.get('session') || ('s-' + Math.random().toString(36).slice(2, 10));
  var appUrl = q.get('app');
  var benchBase = q.get('bench') || new URL('../', location.href).href;
  function withParam(url, k, v) { var u = new URL(url, location.href); u.searchParams.set(k, v); return u.href; }

  // bench_origin tells the app where to address its postMessages (never '*').
  if (appUrl) document.getElementById('appFrame').src = withParam(withParam(appUrl, 'bench_session', session), 'bench_origin', location.origin);
  var benchUrl;
  if (q.get('sync')) {
    // Embedded sync (SPEC 3a): no receiver; the app's replay drives the bench through us.
    benchUrl = withParam(benchBase, 'source', 'parent');
  } else if (q.get('replay')) {
    benchUrl = withParam(withParam(benchBase, 'replay', q.get('replay')), 'topology', q.get('topology') || '');
  } else {
    benchUrl = withParam(withParam(benchBase, 'app', q.get('appid') || ''), 'session', session);
  }
  // A presenter's ?mode= (presentation | engineering) reaches the bench.
  if (q.get('mode')) benchUrl = withParam(benchUrl, 'mode', q.get('mode'));
  document.getElementById('benchFrame').src = benchUrl;
  // A presenter's clicker sends keys to whatever has focus: start with the bench, so → / PageDown,
  // M and R work before anyone clicks (a click in the app pane moves focus there, as expected).
  document.getElementById('benchFrame').addEventListener('load', function () { try { this.contentWindow.focus(); } catch (e) {} });
  // Opened with nothing to show (no app, no recording): say so, and point somewhere useful.
  if (!appUrl && !q.get('replay')) {
    document.querySelector('.split').innerHTML = '<div class="missing"><b>Nothing on the bench yet.</b><span>Open a scenario to see an app and its bench side by side.</span>' +
      '<a href="' + (q.get('back') || q.get('home') || '../../') + '">← Choose a scenario</a></div>';
  }
  document.getElementById('what').textContent = q.get('title') || '';
  // Optional, for a lab that sends visitors here: where "back" goes, and what to do first.
  if (q.get('back')) { var bk = document.getElementById('back'); bk.href = q.get('back'); bk.hidden = false; }
  if (q.get('home')) { var hm = document.getElementById('home'); hm.href = q.get('home'); hm.hidden = false; document.getElementById('brand').href = q.get('home'); }
  // If the app can't be loaded (a stale or wrong link), say so in its pane, not with a bare 404.
  if (appUrl) fetch(new URL(appUrl, location.href).href, { method: 'HEAD' }).then(function (r) {
    if (!r.ok) document.getElementById('appPane').innerHTML = '<div class="missing"><b>This app isn\u2019t here.</b><span>The link may be out of date.</span>' +
      (q.get('back') ? '<a href="' + q.get('back') + '">← Back to all scenarios</a>' : '') + '</div>';
  }).catch(function () {});
  if (q.get('hint')) { var h = document.getElementById('hint'); document.getElementById('hintTx').textContent = q.get('hint'); h.title = q.get('hint'); h.hidden = false; }

  // One layout, always side by side (Trent, 09-29). The bench picks its own mode (Presentation
  // for the shell's sources) and migrates any old view choice itself, so nothing is cleared here.

  // Narrow screens show one pane at a time; a dot on the Bench tab says something happened there.
  document.body.classList.add('show-app');
  function show(which) {
    document.body.classList.toggle('show-app', which === 'app'); document.body.classList.toggle('show-bench', which === 'bench');
    document.getElementById('tApp').classList.toggle('on', which === 'app'); document.getElementById('tBench').classList.toggle('on', which === 'bench');
    if (which === 'bench') document.getElementById('pip').classList.remove('on');
  }
  document.getElementById('tApp').onclick = function () { show('app'); };
  document.getElementById('tBench').onclick = function () { show('bench'); };

  // From the app (sync mode): the bench messages we relay to the bench,
  // buffered until the bench says it's ready. Only the app iframe is listened to.
  var appWin = document.getElementById('appFrame').contentWindow, benchWin = document.getElementById('benchFrame').contentWindow;
  var benchReady = false, pending = [];
  window.addEventListener('message', function (m) {
    var d = m.data;
    if (!d || typeof d.type !== 'string') return;
    if (m.source === benchWin && d.type === 'bench:ready') {
      benchReady = true; pending.forEach(function (x) { benchWin.postMessage(x, location.origin); }); pending = [];
      return;
    }
    if (m.source !== appWin) return;
    if (q.get('sync') && /^bench:(register|events?|reset)$/.test(d.type)) {
      if (benchReady) benchWin.postMessage(d, location.origin); else pending.push(d);
      if (d.type !== 'bench:register' && document.body.classList.contains('show-app')) document.getElementById('pip').classList.add('on');
    }
  });

  // Drag the divider; a shield keeps the iframes from swallowing the mouse.
  var div = document.getElementById('divider'), appPane = document.getElementById('appPane');
  div.onmousedown = function (e) {
    e.preventDefault(); document.body.classList.add('dragging'); div.classList.add('drag');
    function move(ev) { var pct = Math.min(80, Math.max(20, ev.clientX / window.innerWidth * 100)); appPane.style.flex = '0 0 ' + pct + '%'; }
    function up() { document.body.classList.remove('dragging'); div.classList.remove('drag'); removeEventListener('mousemove', move); removeEventListener('mouseup', up); }
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  };
})();
</script>
</body>
</html>
