<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Bench</title>
<style>
  /* Geist and Geist Mono (SIL OFL, viewer/fonts/OFL.txt), served with the viewer: it runs offline. */
  @font-face { font-family: "Geist"; src: local("Geist"), url("viewer/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: local("Geist Mono"), url("viewer/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: dark;   /* dark scrollbars and form controls everywhere */
    --bg: #07080B; --dot: rgba(255,255,255,.055);
    --surface: #0E1015; --surface-2: #13161D; --surface-3: #181C25;
    --border: #232731; --border-2: #2F3441;
    --text: #EDEFF3; --text-2: #AEB4C0; --text-3: #7E8697;
    --path: #3EF0C8; --app: #7DB4FF; --ai: #B69CFF; --rule: #FF9F7A; --person: #FFC857;
    /* the not-taken set, raised to S1's contrast (design/mockups/style/s4-v2/NOTES.md) */
    --off-t: #A2A9B7; --off-m: #9098A8; --off-b: #565D70; --off-line: #666E82; --off-lab: #9BA2B1; --off-bg: rgba(19,22,29,.74);
    --sans: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* Engineering's names for the same palette */
    --panel: var(--surface); --panel-2: var(--surface-2); --muted: #8C94A4;
    --accent: var(--path); --accent-2: var(--ai); --warn: var(--person); --bad: #FF7A8A; --good: var(--path);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 var(--sans); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  #bench { display: flex; flex-direction: column; height: 100vh; }
  #bench > .eng, #bench > .pres { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .mode-presentation > .eng, .mode-engineering > .pres { display: none !important; }

  .bh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .bh .app { font-weight: 600; font-size: 13.5px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--good); border-color: var(--good); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.rep { color: var(--accent-2); border-color: var(--accent-2); }
  .bh select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; padding: 2px 4px; max-width: 260px; }
  /* The bar on top, the same in both modes, never wrapping above 1100 px:
     [the app][who asked and what (Presentation)][the run's status][map inferred][Try another][the switch]. */
  .topbar { flex: none; display: grid; grid-template-columns: auto minmax(360px, 1fr) minmax(0, auto) auto minmax(0, auto) auto; align-items: center; column-gap: 24px; min-height: 80px; padding: 10px 24px;
            background: linear-gradient(#0A0B0F, #0A0B0Fe6); border-bottom: 1px solid var(--border); position: relative; z-index: 4; min-width: 0; }
  .tb-brand { grid-column: 1; display: flex; align-items: center; gap: 12px; min-width: 0; padding-right: 24px; border-right: 1px solid var(--border); }
  .tb-brand[hidden] { display: none; }
  .tb-logo { flex: none; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(140deg, #1B2A2A, #0F1A1A); border: 1px solid #2a4a44; box-shadow: 0 0 18px rgba(62,240,200,.18) inset; }
  .tb-logo i { width: 10px; height: 10px; border-radius: 2px; background: var(--path); box-shadow: 0 0 10px var(--path); }
  .tb-app { display: block; font: 600 17px/1.2 var(--sans); letter-spacing: -.01em; color: var(--text); white-space: nowrap; max-width: 22vw; overflow: hidden; text-overflow: ellipsis; }
  .tb-sub { display: block; font: 400 13px/1.2 var(--mono); color: var(--text-3); margin-top: 1px; white-space: nowrap; }
  .tb-ask { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .mode-engineering .tb-ask { visibility: hidden; }
  .ps-who { font: 400 13px/1.2 var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-who b { color: var(--text-2); font-weight: 500; }
  .ps-who:empty { display: none; }
  /* The whole request, never cut (a trick at its end is the point of some runs): a long one sets smaller. */
  .ps-req { font: 400 17px/1.3 var(--sans); color: var(--text); overflow-wrap: anywhere; }
  .ps-req.r-long { font-size: 15.5px; } .ps-req.r-xlong { font-size: 14px; line-height: 1.28; }
  .ps-req:empty { display: none; }
  /* A fixed width: the request beside it keeps its width (and its line count) when the run ends. */
  .tb-status { grid-column: 3; min-width: 0; width: 330px; display: flex; justify-content: flex-end; }
  .topbar .p-inferred { grid-column: 4; } .tb-pick { grid-column: 5; min-width: 0; } .topbar .viewtoggle { grid-column: 6; }
  .mode-engineering .topbar .p-inferred { display: none !important; }
  .tb-pick:empty { display: none; }
  .ps-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-2); font: 400 14px/1.1 var(--mono); white-space: nowrap; min-width: 0; max-width: 100%; color: var(--text-2); }
  .ps-pill b { font-weight: inherit; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ps-pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .ps-pill.st-ok, .ps-pill.st-running { color: var(--path); border-color: rgba(62,240,200,.28); background: rgba(62,240,200,.06); }
  .ps-pill.st-ok i, .ps-pill.st-running i { box-shadow: 0 0 8px var(--path); }
  .ps-pill.st-running i { animation: blink 1.2s infinite; }
  .ps-pill.st-paused i, .ps-pill.st-idle i { display: none; }
  .ps-pill.st-waiting { color: var(--person); border-color: color-mix(in srgb, var(--person) 35%, transparent); background: rgba(255,200,87,.06); }
  .ps-pill.st-handed { color: var(--app); border-color: color-mix(in srgb, var(--app) 35%, transparent); }
  .ps-pill.st-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .viewtoggle { flex: none; display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); }
  .viewtoggle button { all: unset; cursor: pointer; font: 500 14px/1 var(--sans); padding: 8px 14px; border-radius: 6px; color: var(--text-3); white-space: nowrap; }
  .viewtoggle button:hover { color: var(--text-2); }
  .viewtoggle button.on { background: var(--surface-3); color: var(--text); box-shadow: 0 0 0 1px var(--border-2) inset; }
  .meterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 11.5px; color: var(--muted); }
  .meterbar b { color: var(--accent); font-weight: 600; }
  .meterbar .status { margin-left: auto; }
  .stitle b { color: var(--text); font-weight: 600; letter-spacing: .08em; }
  .stitle span { text-transform: none; letter-spacing: 0; font-size: 11px; margin-left: 6px; }
  .stephead { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 2px; }
  .stephead .tag { margin-left: auto; }
  .stepstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 6px 0; }
  .stepstats b { color: var(--text); font-weight: 600; }
  .stepresult { font-size: 12.5px; color: var(--accent); margin: 4px 0 2px; }
  .status { padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; }
  .st-ok { color: var(--good); } .st-error { color: var(--bad); } .st-aborted { color: var(--warn); } .st-running { color: var(--accent); } .st-waiting { color: var(--warn); }

  #controls { display: none; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; }
  #controls.on { display: flex; flex-wrap: wrap; }
  #controls.on.hide { display: none; }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #controls button:hover { border-color: var(--accent); }

  .graphwrap { overflow-x: auto; }
  .graph { position: relative; margin: 0 auto; }
  .graph svg.edges { position: absolute; left: 0; top: 0; color: var(--off-line); overflow: visible; }
  @keyframes pulse { 50% { box-shadow: 0 0 4px rgba(255,200,87,.2); } }
  @keyframes blink { 50% { opacity: .4; } }
  .unmapped { margin-top: 6px; font-size: 11.5px; }

  /* ---- Engineering (S4): the same map as Presentation on the left; a docked panel on the right led by
     the step's card (its numbers, then a waterfall of every call inside it), the run's other panels
     folded under it; the replay controls, badges and meters in one strip on top; the event log a drawer. */
  .eng { position: relative; background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; background-position: 12px 12px; }
  .eng-top { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 7px 16px; border-bottom: 1px solid var(--border); background: #0A0B0F; position: relative; z-index: 3; }
  .eng-top #controls, .eng-top .bh, .eng-top .meterbar { border: 0; background: none; padding: 0; }
  .eng-top .meterbar { flex: 1 1 auto; font-size: 12.5px; }
  .bgrid { --acc: var(--path); position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .bgrid.a-app { --acc: var(--app); } .bgrid.a-ai { --acc: var(--ai); } .bgrid.a-rule { --acc: var(--rule); } .bgrid.a-person { --acc: var(--person); }
  .col { min-width: 0; min-height: 0; }
  .panelcol { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; overflow: auto; background: linear-gradient(180deg, #0D0F14, #0A0C10); scrollbar-width: thin; scrollbar-color: #2A2F3B transparent; }
  .panelcol::before { content: ""; position: sticky; display: block; top: 0; height: 2px; margin-bottom: -2px; z-index: 2; background: var(--acc); box-shadow: 0 0 14px var(--acc); }
  .panelcol > .panel, .panelcol > .eng-wait { max-width: 1240px; margin-left: auto; margin-right: auto; }
  .eng-wait { display: none; padding: 26px 24px; font: 400 16px/1.5 var(--sans); color: var(--text-2); }
  .eng-wait b { color: var(--text); font-weight: 600; }
  .panelcol.norun .panel { display: none; }
  .panelcol.norun .eng-wait { display: block; }
  .panelcol.norun::before { display: none; }
  .stitle { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 6px; }

  /* The step's card */
  .stepcard .pbody { padding: 22px 26px 20px; font: 400 15px/1.45 var(--sans); }
  .es-head { display: flex; align-items: center; gap: 14px; }
  .es-head .bb-num { width: 40px; height: 40px; font-size: 18px; }
  .es-name { min-width: 0; font: 600 26px/1.15 var(--sans); letter-spacing: -.02em; color: var(--text); }
  .stepcard .bb-metas { margin-top: 14px; font-size: 13.5px; }
  .stepcard .bb-metas span { padding: 7px 12px; }
  .es-desc { margin: 12px 0 0; font-size: 15.5px; line-height: 1.5; color: var(--text-2); }
  .es-none { margin: 14px 0 0; font-size: 16px; color: var(--text-3); }
  .es-lab { margin: 20px 0 8px; font: 500 13px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); display: flex; gap: 10px; align-items: center; }
  .es-lab::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .es-cap { font: 400 12.5px/1.5 var(--mono); color: var(--text-3); margin-top: 6px; }
  .es-result { margin-top: 12px; font: 400 14px/1.45 var(--mono); color: var(--path); overflow-wrap: anywhere; }
  .es-result span { color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; margin-right: 10px; }
  .es-fold { margin-top: 12px; }
  .es-fold > summary { list-style: none; cursor: pointer; font: 500 13px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 6px 0; }
  .es-fold > summary::-webkit-details-marker { display: none; }
  .es-fold > summary:hover { color: var(--text-2); }
  .es-fold .n { color: var(--text-2); }
  .es-fbody { padding: 4px 0 0; font-size: 13px; }
  .es-note { margin: 14px 0 0; font-size: 13.5px; color: var(--text-3); } .es-note b { color: var(--text-2); font-weight: 500; }
  .chev { display: inline-block; width: 14px; flex: none; font-style: normal; color: var(--text-3); }
  .chev::before { content: "▸"; }
  details[open] > summary .chev::before, .panel.open > .ptitle .chev::before { content: "▾"; color: var(--text-2); }
  .chev.none::before { content: ""; }
  /* The calls inside one step: a waterfall by start time, round ticks with a gridline each; rows open. */
  .wf { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font: 13.5px/1.3 var(--mono); }
  .wf .hd, .wf summary, .wf .sum { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr) 160px; align-items: center; }
  .wf .hd { color: var(--text-3); background: var(--surface-2); border-bottom: 1px solid var(--border); padding: 7px 0 6px; font-size: 12.5px; }
  .wf .hd > span { padding: 0 10px; } .wf .hd > span:last-child { text-align: right; }
  .wf .hd .ticks { position: relative; height: 15px; padding: 0; margin: 0 10px; }
  .wf .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .wf .ticks span:first-child { transform: none; } .wf .ticks span.end { transform: translateX(-100%); }
  .wf summary, .wf .sum { list-style: none; cursor: pointer; min-height: 32px; border-top: 1px solid #1B1F28; }
  .wf .sum { cursor: default; }
  .wf summary::-webkit-details-marker { display: none; }
  .wf summary:hover { background: rgba(255,255,255,.025); }
  .wf .wfr:first-of-type .sum { border-top: 0; }
  .wf .nm { padding: 0 10px 0 8px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .wf .nm .no { flex: none; width: 16px; text-align: right; color: var(--text-3); font-size: 12px; }
  .wf .nm .tw { color: #4A5163; flex: none; }
  .wf .nm .op { font-size: 12px; padding: 1px 5px; border-radius: 4px; color: var(--k, var(--text-2)); border: 1px solid color-mix(in srgb, var(--k, var(--text-2)) 40%, transparent); flex: none; }
  .wf .nm .ar { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
  .wf .lane { position: relative; height: 32px; margin: 0 10px; background-image: linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px); background-repeat: repeat-x; background-position: 0 0; }
  .wf .bar { position: absolute; top: 10px; height: 12px; border-radius: 3px; background: var(--k); min-width: 3px; }
  .wf .bar.node { --k: var(--text-3); background: color-mix(in srgb, var(--text-3) 18%, transparent); border: 1px solid color-mix(in srgb, var(--text-3) 50%, transparent); }
  .wf .bar i { position: absolute; left: 100%; top: -1px; margin-left: 6px; font-style: normal; font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .wf .bar.inl i { left: 6px; margin-left: 0; color: #0B0C10; font-weight: 600; }
  .wf .mt { padding: 0 10px; color: var(--text-2); text-align: right; white-space: nowrap; }
  .wf .mt b { color: var(--text); font-weight: 500; }
  .wf .mt .par { color: var(--app); margin-right: 8px; font-size: 12px; }
  .wf .xp { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 4px 14px; border-top: 1px dashed #262B36; background: #0B0D12; padding: 9px 12px 10px 38px; color: var(--text-2); line-height: 1.5; font-size: 13px; }
  .wf .xp .k { color: var(--text-3); }
  .wf .xp pre { margin: 0; font: 13px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; color: #D6DBE4; }
  .wf .xp .s, .wf .xp pre.s { color: #9FE6CF; }
  /* The step timeline (a folded panel) */
  .wrow { display: grid; grid-template-columns: 150px 1fr 70px; gap: 8px; align-items: center; font-size: 12.5px; height: 20px; }
  .wrow.child .wl { padding-left: 10px; }
  .wl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .wtrack { position: relative; height: 9px; background: rgba(42,51,80,.45); border-radius: 3px; }
  .wbar { position: absolute; top: 0; bottom: 0; background: var(--accent-2); border-radius: 3px; min-width: 2px; }
  .wbar.inferred { opacity: .55; }
  .wbar.gate { background: var(--warn); }
  .wbar.error { background: var(--bad); }
  .wbar.skipped { background: transparent; border: 1px dotted var(--muted); }
  .wbar.open { background: var(--accent); animation: pulse 1.2s infinite; }
  .wv { text-align: right; color: var(--text); }
  .legend { font-size: 10.5px; margin-top: 4px; }

  /* The run's other panels, folded under the step's card: a title row that opens and shuts each. */
  .panel { border-top: 1px solid var(--border); }
  .panel.stepcard { border-top: 0; }
  .panel.stepcard > .ptitle { display: none; }
  .panel:not(.open) > .pbody { display: none; }
  .ptitle { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 22px; cursor: pointer; font: 500 12.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); user-select: none; }
  .ptitle:hover { color: var(--text-2); background: rgba(255,255,255,.015); }
  .ptitle .pt { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .panel.empty > .ptitle { opacity: .6; }
  .pbody { padding: 2px 22px 18px; font-size: 13px; }
  .pcount { color: var(--accent); }
  .pright { display: flex; gap: 6px; align-items: center; }
  .rawbtn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font: 11px var(--mono); padding: 1px 6px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .rawbtn:hover { border-color: var(--accent); color: var(--text); }
  .rawbtn.on { color: var(--accent); border-color: var(--accent); }
  .panel.storied > .ptitle { color: color-mix(in srgb, var(--ai) 70%, var(--text-3)); }
  .iolabel { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-2); margin: 8px 0 3px; }
  pre.io { margin: 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, monospace; background: #0B0D12; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; color: var(--text); }
  pre.io.out { border-color: var(--accent); }
  details.hit > summary { cursor: pointer; list-style: none; }
  details.hit > summary::-webkit-details-marker { display: none; }
  details.hit > summary::before { content: '▸'; color: var(--muted); margin-right: 2px; }
  details.hit[open] > summary::before { content: '▾'; color: var(--accent); }
  .iotabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .iotab { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font: 10.5px ui-monospace, monospace; padding: 1px 7px; cursor: pointer; }
  .iotab.on { color: var(--accent); border-color: var(--accent); }
  .pev + .pev { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 4px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 2px 0; border-bottom: 1px dashed rgba(42,51,80,.7); }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v { text-align: right; overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 11px; }
  .kv.hi .v { color: var(--accent); font-weight: 600; }
  .row { font-size: 11.5px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; padding: 2px 0; }
  .row .right { margin-left: auto; color: var(--muted); }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--border); color: var(--accent-2); font-family: ui-monospace, monospace; }
  .src { font-size: 9.5px; padding: 0 4px; border-radius: 6px; border: 1px solid currentColor; }
  .src-actual { color: var(--good); } .src-estimated { color: var(--warn); }
  .note { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
  .note.quote { color: var(--text); border-left: 2px solid var(--border); padding-left: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note.out { border-left-color: var(--accent); }
  .gate { font-size: 12px; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; }
  .gate.waiting { background: rgba(251,191,36,.16); border: 1px solid var(--warn); }
  .gate.ok { color: var(--good); } .gate.bad { color: var(--bad); }
  .err { color: var(--bad); font-size: 12px; }
  .mc + .mc { border-top: 1px dashed var(--border); margin-top: 5px; padding-top: 5px; }
  .mc { font-size: 11.5px; } .mc-error b { color: var(--bad); } .mc-warning b { color: var(--warn); } .mc-info b { color: var(--muted); }

  /* The event log: a drawer, shut by default (one line), the bottom third when open. */
  .logcol { flex: none; border-top: 1px solid var(--border); background: #0A0B0F; position: relative; z-index: 3; }
  .logtoggle { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 16px; cursor: pointer; font: 400 13px/1.2 var(--mono); color: var(--text-3); }
  .logtoggle b { color: var(--text-2); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .logtoggle:hover { color: var(--text-2); }
  .logtoggle .lt-arrow { margin-left: auto; }
  .logcol .log { display: none; height: 32vh; overflow: auto; padding: 0 16px 8px; }
  .logcol.open .log { display: block; }
  .log { font-size: 12px; }
  .lrow { display: grid; grid-template-columns: 30px 70px 130px 140px 1fr; gap: 8px; padding: 2px 0; border-bottom: 1px solid rgba(42,51,80,.5); }
  .lrow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .ls, .lrow .lt { color: var(--muted); text-align: right; }
  .lrow .le { color: var(--accent-2); }
  .lrow .ld { color: var(--muted); }
  .lrow.t-llm_call .le { color: var(--accent); } .lrow.t-error .le { color: var(--bad); } .lrow.t-gate_waiting .le, .lrow.t-gate_resolved .le { color: var(--warn); }

  .aud { color: var(--accent-2); font-size: 9.5px; }
  .ck { font-size: 11.5px; white-space: nowrap; }
  .ck-passed, .c-passed { color: var(--good); } .ck-failed, .c-failed { color: var(--bad); } .ck-not_on_path, .ck-pending, .c-not_on_path, .c-pending { color: var(--muted); } .ck-ran, .ck-running { color: var(--accent); }
  .srcblock + .srcblock { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 6px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .tile { min-width: 24px; height: 22px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--muted); font: 11px ui-monospace, monospace; cursor: pointer; opacity: .7; }
  .tile.st-found { border-color: var(--accent-2); color: var(--text); opacity: 1; }
  .tile.st-given { background: rgba(62,240,200,.12); border-color: var(--accent); color: var(--accent); opacity: 1; }
  .tile.relied { background: var(--accent); color: #0B0C10; }
  .tile.sel { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .legend .tile { cursor: default; display: inline-block; min-width: 0; width: 13px; height: 11px; padding: 0; vertical-align: -1px; margin: 0 3px 0 8px; font-size: 0; }

  /* ---- Presentation, pane-first -------------------------------------------------------------------
     Designed for the bench beside an app (a ~700 px pane at a 1440×900 window); a full screen is the
     same layout, wider. The map is always on top. The whole map (.v-map) fills the stage while a run
     plays, a line under it about the step it's on; a step clicked (.v-detail), the same map glides to
     a compact size pinned on top (its height set by bench.js) and the step's detail scrolls under it.
     "What the AI was given" is a drawer over the detail only. One marker: the step the detail is about
     is ringed in its actor's colour, its badge filled, the same badge heading the detail. */
  .pres { position: relative; background: var(--bg);
          background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; background-position: 12px 12px; }
  .a-app { --ac: var(--app); } .a-ai { --ac: var(--ai); } .a-rule { --ac: var(--rule); } .a-person { --ac: var(--person); }
  .ps-stage { --acc: var(--path); position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .ps-stage.a-app { --acc: var(--app); } .ps-stage.a-ai { --acc: var(--ai); } .ps-stage.a-rule { --acc: var(--rule); } .ps-stage.a-person { --acc: var(--person); }
  .ps-map { position: relative; z-index: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 10px 16px 0; }
  .pres .ps-map { flex: 1 1 auto; }
  .v-detail .pres .ps-map, .bgrid > .ps-map { flex: 0 0 auto; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, transparent, rgba(7,8,11,.6)); }
  .ps-flowhead { flex: none; display: flex; align-items: center; gap: 10px 14px; height: 32px; padding: 0 2px 6px; font: 500 12.5px/1.2 var(--mono); color: var(--text-3); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .fh-l { display: flex; align-items: baseline; gap: 10px; min-width: 0; overflow: hidden; }
  .fh-l b { color: var(--text-2); font-weight: 500; }
  .fh-l > span::before { content: "·"; margin-right: 10px; color: var(--border-2); }
  .v-detail .fh-k, .eng .fh-k { display: none; }
  .v-detail .fh-l > span:first-of-type::before, .eng .fh-l > span:first-of-type::before { display: none; }
  .bb-headline + .bb-strip, .bb-sub + .bb-strip { margin-top: 12px; }
  .fh-hint { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text-2); }
  .ps-legend { display: flex; gap: 12px; margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12.5px; }
  .ps-legend span { display: flex; align-items: center; gap: 5px; color: var(--text-3); }
  .ps-legend i { width: 8px; height: 8px; border-radius: 2px; background: var(--ac); }
  .ps-map .graphwrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .ps-map .graphwrap.scrolly { overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2A2F3B transparent; }
  .ps-side { position: relative; z-index: 2; flex: 0 0 auto; min-height: 0; min-width: 0; display: flex; flex-direction: column; container-type: inline-size; }
  .v-detail .ps-side { flex: 1 1 auto; }
  /* The line under the whole map */
  .ps-now { flex: none; border-top: 1px solid var(--border); background: linear-gradient(180deg, #0C0D12, #090A0E); }
  .v-detail .ps-now { display: none; }
  .now { --acc: var(--ac, var(--path)); display: flex; align-items: center; gap: 12px; height: 62px; padding: 6px 16px; overflow: hidden; }
  .now .bb-num { width: 34px; height: 34px; font-size: 16px; border-radius: 8px; }
  .now-t { flex: 1; min-width: 0; }
  .now-name { font: 600 16px/1.25 var(--sans); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-st { font: 400 12.5px/1 var(--mono); color: var(--text-3); margin-left: 6px; }
  .now.s-now .now-st { color: var(--path); } .now.s-waiting .now-st { color: var(--person); }
  .now-h { margin-top: 3px; font: 400 15px/1.35 var(--sans); color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now-h em { font-style: normal; color: var(--acc); } .now-h .nx { color: var(--path); }
  .now.done .now-name { color: var(--path); }
  .now.idle .now-h { font-size: 15px; }
  .now-open { all: unset; box-sizing: border-box; cursor: pointer; flex: none; font: 500 14px/1 var(--sans); color: var(--text); padding: 9px 12px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--surface-2); white-space: nowrap; }
  .now-open:hover { border-color: var(--acc); }
  .now .p-btn { flex: none; }
  /* The detail */
  .ps-bubble { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: #2A2F3B transparent; background: linear-gradient(180deg, #0D0F14, #0A0C10); }
  .v-map .ps-bubble { display: none; }
  .ps-bubble::before { content: ""; position: sticky; display: block; top: 0; left: 0; right: 0; height: 2px; margin-bottom: -2px; z-index: 2; background: var(--acc); box-shadow: 0 0 14px var(--acc); }
  .ps-bubble > .bb { max-width: 1240px; margin: 0 auto; }
  /* When the detail holds more than it shows: a fade at its foot and a "more below" cue (bench.js). */
  .ps-more { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; pointer-events: none; z-index: 3; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
             background: linear-gradient(180deg, rgba(10,12,16,0), #0A0C10 78%); font: 400 13px/1 var(--mono); color: var(--text-2); }
  .ps-more[hidden] { display: none; }
  .ps-more span { border: 1px solid var(--border-2); border-radius: 999px; padding: 5px 11px; background: var(--surface); }
  /* "Your turn": beside the step waiting for a person, toward the app. */
  .ps-cue { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; font: 500 14px/1.25 var(--sans); color: var(--person); background: rgba(20,17,9,.95);
            border: 1px solid rgba(255,200,87,.5); border-radius: 8px; padding: 7px 11px; white-space: nowrap; pointer-events: none; box-shadow: 0 0 24px rgba(255,200,87,.16); animation: cuein .35s ease-out; }
  .ps-cue[hidden] { display: none; }
  .ps-cue b { font-weight: 600; }
  .ps-cue .ar { display: inline-block; animation: nudge 1.3s ease-in-out infinite; }
  @keyframes cuein { from { opacity: 0; transform: translateX(8px); } }
  @keyframes nudge { 50% { transform: translateX(-4px); } }
  /* The drawer: "What the AI was given", over the detail only. */
  .ps-drawer { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; background: #0C0E13; border-top: 2px solid var(--ai);
               box-shadow: 0 -18px 40px rgba(0,0,0,.55), 0 -1px 24px color-mix(in srgb, var(--ai) 25%, transparent);
               transform: translateY(102%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.75,.2,1), visibility 0s linear .32s; }
  .ps-drawer.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.75,.2,1), visibility 0s; }
  .dr-hd { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .dr-back { all: unset; box-sizing: border-box; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 8px; font: 500 15px/1 var(--sans); color: var(--text); padding: 8px 12px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--surface-2); white-space: nowrap; }
  .dr-back:hover { border-color: var(--ac); }
  .dr-back .b { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font: 600 12px/1 var(--mono); background: var(--ac); color: #0B0C10; }
  .dr-t { flex: 1; min-width: 0; font: 600 17px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dr-t small { display: block; font: 400 13px/1.3 var(--mono); color: var(--text-3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; }
  .dr-hd .g-big { margin-left: 0; flex: none; }
  .dr-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2A2F3B transparent; }
  .dr-body.g-panel { max-width: none; margin: 0; padding: 4px 16px 24px; }
  .dr-body .g-note { font-size: 14.5px; }
  .dr-body .g-call { margin-top: 10px; }

  /* The map's boxes: a badge (the step's number in run order, a letter once the run is over and it
     wasn't taken), the plain name, a line under it (time, then what's worth a glance) and who does the
     step; compact boxes keep the name only (the badge in its actor's colour, a legend over the map).
     bench.js BOX_TYPE matches these sizes. */
  .snode { position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 10px; border-radius: 10px; overflow: visible; cursor: pointer;
           background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--border-2); color: var(--text);
           box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35); transition: box-shadow .35s, border-color .3s, background-color .3s, color .3s, opacity .4s; }
  .snode:hover { border-color: color-mix(in srgb, var(--ac) 60%, var(--border-2)); }
  .snode .s-num { flex: none; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font: 600 13px/1 var(--mono); color: var(--ac);
                  background: color-mix(in srgb, var(--ac) 12%, transparent); border: 1px solid color-mix(in srgb, var(--ac) 40%, transparent); transition: background-color .3s, color .3s, box-shadow .3s; }
  .snode .s-body { flex: 1; min-width: 0; }
  .snode .gl { font: 500 16px/20px var(--sans); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t-two .snode .gl { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .snode .s-meta { font: 400 12.5px/16px var(--mono); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .snode .s-meta .v { color: var(--text-2); }
  .snode .s-meta:empty { display: none; }
  .snode .actor { flex: none; font: 500 12.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ac); opacity: .9; border: none; padding: 0; background: none; }
  .t-wide .snode { gap: 12px; padding: 0 14px 0 12px; }
  .t-wide .snode .gl { font-size: 18px; line-height: 22px; }
  .t-wide .snode .s-meta { font-size: 13.5px; line-height: 18px; }
  .t-wide .snode .s-num { width: 28px; height: 28px; font-size: 14px; }
  .t-wide .snode .actor { font-size: 13.5px; }
  .t-compact .snode { gap: 9px; padding: 0 10px 0 8px; border-radius: 8px; box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 4px 14px rgba(0,0,0,.3); }
  .t-compact .snode .s-meta, .t-compact .snode .actor { display: none; }
  .t-compact .snode .s-num { width: 24px; height: 24px; font-size: 12.5px; border-radius: 6px; }
  .t-compact.t-wide .snode { gap: 10px; padding: 0 12px 0 10px; }
  .t-compact.t-wide .snode .gl { font-size: 17px; line-height: 21px; }
  .t-compact.t-wide .snode .s-num { width: 26px; height: 26px; font-size: 13px; }
  .pips { display: inline-flex; gap: 3px; vertical-align: -1px; margin-left: 6px; }
  .pips i { width: 7px; height: 10px; border-radius: 2px; background: var(--app); }
  .pips i.ai { background: var(--ai); }
  /* States: not reached yet (a dim dot for a badge), lit (done), running (a teal glow with a sweep),
     waiting for a person (a pulse in their colour), not taken once the run is over (dashed). */
  .snode.done, .snode.active, .snode.starting { border-color: color-mix(in srgb, var(--path) 30%, var(--border-2)); }
  .snode.active .s-meta .v, .snode.starting .s-meta .v { color: var(--path); }
  .snode.idle { color: var(--text-2); }
  .snode.idle .s-num { color: var(--text-3); background: transparent; border-color: var(--border-2); }
  .snode .s-num:empty { background: transparent; border-color: transparent; box-shadow: none; }
  .snode .s-num:empty::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); opacity: .7; }
  .snode.active, .snode.starting { border-color: var(--path); box-shadow: 0 0 0 1px rgba(62,240,200,.35), 0 0 28px rgba(62,240,200,.28), 0 8px 24px rgba(0,0,0,.35); }
  .snode.active::after, .snode.starting::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                                                 background: linear-gradient(100deg, transparent 30%, rgba(62,240,200,.11) 50%, transparent 70%); background-size: 250% 100%; animation: sweep 1.3s linear infinite; }
  @keyframes sweep { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .snode.gatewait { border-color: var(--person); animation: gatepulse 1.5s ease-in-out infinite; }
  .snode.gatewait .s-meta .v { color: var(--person); }
  @keyframes gatepulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(255,200,87,.55), 0 0 30px rgba(255,200,87,.38), 0 8px 24px rgba(0,0,0,.35); } 50% { box-shadow: 0 0 0 1px rgba(255,200,87,.25), 0 0 8px rgba(255,200,87,.12), 0 8px 24px rgba(0,0,0,.35); } }
  .snode.untaken, .snode.skipped { background: var(--off-bg); border: 1.5px dashed var(--off-b); box-shadow: none; }
  .snode.untaken .gl, .snode.skipped .gl { color: var(--off-t); font-weight: 500; }
  .snode.untaken .s-meta, .snode.skipped .s-meta { color: var(--off-m); }
  .snode.untaken .s-num, .snode.skipped .s-num { color: var(--off-t); background: transparent; border-color: var(--off-b); border-style: dashed; }
  .snode.untaken .actor { opacity: .7; }
  .snode.error { border-color: var(--bad); }
  /* The one marker: the step the detail is about, ringed in its actor's colour, its badge filled. */
  .snode.focus { border: 1.5px solid var(--ac); background: linear-gradient(180deg, color-mix(in srgb, var(--ac) 11%, var(--surface-2)), var(--surface));
                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 18%, transparent), 0 0 30px color-mix(in srgb, var(--ac) 24%, transparent), 0 8px 24px rgba(0,0,0,.4); }
  .snode.focus .s-num { background: var(--ac); color: #0B0C10; border: 1px solid var(--ac); box-shadow: 0 0 12px color-mix(in srgb, var(--ac) 60%, transparent); }
  .snode.focus .gl { color: var(--text); font-weight: 600; }
  .snode.untaken.focus { border: 1.5px dashed var(--ac); }
  .snode.selected { outline: none; }
  .snode:focus { outline: none; }
  .snode:focus-visible { outline: 2px solid color-mix(in srgb, var(--ac) 80%, white); outline-offset: 3px; }
  /* In the detail, the ringed step is the way back to the whole map (bench.js: click it again). */
  .v-detail .pres .snode.focus { cursor: zoom-out; }
  .snode .s-back { display: none; }
  .v-detail .pres .snode.focus:hover .s-back, .v-detail .pres .snode.focus:focus-visible .s-back {
    display: grid; place-items: center; position: absolute; right: 7px; top: 50%; width: 22px; height: 22px; margin-top: -11px; pointer-events: none;
    color: color-mix(in srgb, var(--ac) 80%, var(--text)); border-radius: 6px;
    background: color-mix(in srgb, var(--ac) 16%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--ac) 40%, transparent); animation: sback .18s ease-out; }
  .v-detail .pres .snode.focus { transition: box-shadow .35s, border-color .3s, background-color .3s, color .3s, opacity .4s, padding .18s; }
  .v-detail .pres .snode.focus:hover, .v-detail .pres .snode.focus:focus-visible { padding-right: 36px; }   /* the name ellipsizes before the icon */
  /* ...and the map's heading says it in words, where the legend was (the legend comes back after). */
  .fh-back { display: none; margin-left: auto; text-transform: none; letter-spacing: 0; font: 400 12.5px/1 var(--mono); color: var(--text-2); }
  .fh-back kbd { font: 500 11px/1 var(--mono); color: var(--text-3); border: 1px solid var(--border-2); border-radius: 4px; padding: 2px 5px; margin-left: 6px; }
  .v-detail .pres .ps-map:has(.snode.focus:hover, .snode.focus:focus-visible) .fh-back { display: inline-flex; align-items: center; animation: sback .18s ease-out; }
  .v-detail .pres .ps-map:has(.snode.focus:hover, .snode.focus:focus-visible) .ps-legend { display: none; }
  @keyframes sback { from { opacity: 0; } }

  /* Lines: this run's path solid and glowing in the path colour, running into its boxes (no arrowhead,
     no seam); the line into the step being shown running marches (draws on first, bench.js); every
     other path dashed in --off-line, with an arrowhead. Labels sit on plates: a lit one in the path
     colour, the rest dashed. */
  .ps-map .graph svg.edges { overflow: visible; }
  .ps-map .edge path.ln { fill: none; stroke: var(--off-line); stroke-width: 1.6; stroke-dasharray: 5 5; marker-end: url(#parr-u); transition: opacity .4s; }
  .ps-map .edge .glow, .ps-map .edge .flow { display: none; }
  .ps-map .edge.untaken path.ln { opacity: .8; }
  .ps-map .edge.taken path.ln { stroke: var(--path); stroke-width: 2.4; stroke-dasharray: none; marker-end: none; }
  .ps-map .edge.taken .glow { display: inline; fill: none; stroke: var(--path); stroke-width: 7; opacity: .6; filter: url(#pglow); }
  .t-compact .edge.taken .glow { stroke-width: 5.5; }
  /* A finished run's path keeps a little energy: a soft halo in the path colour that breathes slowly,
     and a faint bloom on the line itself. Untaken (dashed) lines get none. */
  .run-done .edge.taken path.ln { filter: drop-shadow(0 0 3px rgba(62,240,200,.6)); }
  .run-done .edge.taken .glow { opacity: .7; animation: pbreathe 4s ease-in-out infinite; }
  @keyframes pbreathe { 0%, 100% { opacity: .52; } 50% { opacity: .88; } }
  /* The line being travelled reads as travel: the lit line under it dimmed, bright dashes marching on it. */
  .ps-map .edge.flowing path.ln { stroke-opacity: .4; }
  .ps-map .edge.flowing .glow { opacity: .36; }
  .ps-map .edge.flowing .flow { display: inline; fill: none; stroke: #E6FFF9; stroke-width: 2.8; stroke-linecap: round; stroke-dasharray: 6 8; opacity: 1; animation: pflow .5s linear infinite; filter: drop-shadow(0 0 3px rgba(62,240,200,.9)); }
  .ps-map .edge.flowing.to-person .flow { stroke: #FFE3A6; }
  @keyframes pflow { to { stroke-dashoffset: -14; } }
  .ps-map .edge path.ln { transition: opacity .4s, stroke-opacity .35s; }
  .t-compact .edge.taken path.ln { stroke-width: 2.2; }
  .ps-map marker.parr-u { color: var(--off-line); }
  .ps-map .edge .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: help; }
  .elabel { position: absolute; z-index: 1; transform: translate(-50%, -50%); font: 400 13px/1 var(--mono); padding: 5px 8px; border-radius: 6px; white-space: nowrap; pointer-events: none;
            background: var(--bg); color: var(--off-lab); border: 1px dashed #4A5163; transition: color .3s, border-color .3s, box-shadow .3s; }

    .ps-drawer, .ps-drawer.open { transition: none; }

  }

  /* ---- the panel ---- */
  .bb { padding: 22px 32px 26px; font: 400 18px/1.5 var(--sans); color: var(--text); }
  .bb-head { display: flex; align-items: center; gap: 16px; }
  /* Two ways back to the whole map from a step's detail (besides clicking the ringed step, or M):
     a tab on the sheet's top edge, and a quiet button at the end of the step's header. */
  .bb-min { all: unset; box-sizing: border-box; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px 0 8px; border-radius: 7px;
            font: 400 13px/1 var(--mono); color: var(--text-3); border: 1px solid var(--border-2); background: transparent; transition: color .15s, border-color .15s, background-color .15s; }
  .bb-min:hover { color: var(--text); border-color: color-mix(in srgb, var(--path) 55%, var(--border-2)); background: var(--surface-2); }
  .bb-min:focus-visible, .ps-grab:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
  .ps-grab { display: none; }
  .v-detail .pres .ps-grab { all: unset; box-sizing: border-box; position: absolute; z-index: 5; top: 0; left: 50%; transform: translate(-50%, -50%); cursor: pointer;
            display: grid; place-items: center; width: 46px; height: 18px; border-radius: 99px; color: var(--text-3);
            background: var(--surface-2); border: 1px solid var(--border-2); box-shadow: 0 4px 12px rgba(0,0,0,.45); transition: color .15s, border-color .15s, width .15s; }
  .v-detail .pres .ps-grab:hover { color: var(--text); border-color: color-mix(in srgb, var(--path) 55%, var(--border-2)); width: 54px; }
  .v-detail .pres .ps-grab:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
  .bb-num { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; font: 600 20px/1 var(--mono); background: var(--acc); color: #0B0C10; box-shadow: 0 0 22px color-mix(in srgb, var(--acc) 50%, transparent); }
  .bb-num.off { background: color-mix(in srgb, var(--acc) 22%, #0B0D12); color: var(--text); border: 1.5px solid color-mix(in srgb, var(--acc) 60%, transparent); box-shadow: none; }
  .bb-name { min-width: 0; font: 600 30px/1.1 var(--sans); letter-spacing: -.02em; }
  .bb-who { flex: none; font: 500 14px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--acc); padding: 6px 9px; border-radius: 6px; background: color-mix(in srgb, var(--acc) 12%, transparent); }
  .bb-tag { flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font: 400 14px/1 var(--mono); color: var(--text-2); padding: 7px 11px; border: 1px solid var(--border-2); border-radius: 7px; white-space: nowrap; }
  .bb-tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--path); box-shadow: 0 0 8px var(--path); }
  .bb-tag.t-not_needed i, .bb-tag.t-pending i { background: transparent; border: 1.5px dashed var(--text-3); box-shadow: none; }
  .bb-tag.t-waiting i, .bb-tag.t-now i { background: var(--person); box-shadow: 0 0 8px var(--person); animation: blink 1.4s ease-in-out infinite; }
  .bb-tag.t-error i { background: var(--bad); box-shadow: none; }
  .bb-head .bb-tag + .p-x { margin-left: 0; }
  .p-x { flex: none; margin-left: auto; background: none; border: 1px solid var(--border-2); color: var(--text-2); border-radius: 7px; cursor: pointer; font: 400 14px/1 var(--mono); padding: 7px 10px; }
  .p-x:hover { color: var(--text); }
  .bb-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin-top: 14px; }
  .bb-strip .p-acts { margin: 0; }
  .bb-metas { display: flex; flex-wrap: wrap; margin: 0; font: 400 14px/1.3 var(--mono); color: var(--text-3); border: 1px solid var(--border); border-radius: 8px; background: rgba(255,255,255,.015); }
  .bb-metas span { padding: 8px 14px; border-right: 1px solid var(--border); }
  .bb-metas span:last-child { border-right: 0; }
  .bb-metas b { color: var(--text); font-weight: 500; }
  .bb-headline { margin: 18px 0 6px; font: 600 23px/1.3 var(--sans); letter-spacing: -.01em; }
  .bb-headline em { font-style: normal; color: var(--acc); }
  .bb-headline .nx { color: var(--path); }
  .bb-sub, .bb-about { margin: 0; font-size: 18px; line-height: 1.5; color: var(--text-2); max-width: 62em; }
  .bb-sec { margin-top: 20px; }

  .bb-sec h4::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .p-btn { background: var(--surface); color: var(--text-2); border: 1px solid var(--border-2); border-radius: 7px; padding: 7px 12px; cursor: pointer; font: 400 14px/1.2 var(--mono); text-decoration: none; display: inline-flex; align-items: center; gap: .45em; }
  .p-btn:hover { color: var(--text); border-color: var(--text-3); }
  .p-btn.primary { color: var(--path); border-color: rgba(62,240,200,.45); background: rgba(62,240,200,.06); }
  /* Choices */
  .bb-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
  .bb-card { border: 1.5px dashed var(--off-b); border-radius: 10px; padding: 11px 14px 12px; color: var(--off-m); }
  .bb-card .k { font: 400 15px/1.3 var(--mono); color: var(--off-lab); }
  .bb-card .to { font-size: 17px; margin-top: 4px; color: var(--text-2); line-height: 1.35; }

  .bb-card .why { font-size: 15px; margin-top: 6px; line-height: 1.4; }
  .bb-card.chosen { border: 1.5px solid var(--path); background: linear-gradient(180deg, rgba(62,240,200,.09), rgba(62,240,200,.02)); color: var(--text-2); box-shadow: 0 0 28px rgba(62,240,200,.10); }

  .bb-chosen { font: 600 13px/1 var(--mono); color: #0B0C10; background: var(--path); padding: 3px 7px; border-radius: 5px; margin-left: 8px; vertical-align: 1px; display: inline-block; text-transform: uppercase; }
  /* Quotes, the confidence meter, the verdict line */
  .bb-quote { margin: 0; position: relative; border-left: 3px solid var(--acc); background: color-mix(in srgb, var(--acc) 6%, transparent); border-radius: 0 10px 10px 0; padding: 16px 20px; font-size: 20px; line-height: 1.5; color: var(--text); }
  .bb-quote.reply { border-left-color: var(--path); background: rgba(62,240,200,.04); }
  .bb-quote .qsrc, .bb-src { display: block; margin-top: 10px; font: 400 13px/1.4 var(--mono); color: var(--text-3); }
  .bb-text { white-space: pre-wrap; }
  .bb-text.folded { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .bb-more { background: none; border: none; color: var(--path); font: 400 14px var(--mono); cursor: pointer; padding: 4px 0 0; }
  .bb-meter { display: flex; align-items: center; gap: 14px; margin-top: 14px; font: 400 14px/1 var(--mono); color: var(--text-3); padding-bottom: 18px; }
  .bb-meter .bar { position: relative; flex: 1; height: 8px; border-radius: 4px; background: #1A1E27; max-width: 420px; }
  .bb-meter .f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 40%, transparent), var(--acc)); }
  .bb-meter .th { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--text-2); }
  .bb-meter .thl { position: absolute; top: 14px; transform: translateX(-50%); font-size: 13px; color: var(--text-3); white-space: nowrap; }
  .bb-meter b { color: var(--text); font-weight: 600; font-size: 16px; }
  .bb-check { display: flex; align-items: baseline; gap: 12px; font-size: 17px; color: var(--text-2); padding: 4px 0; }
  .bb-sym { flex: none; font: 400 13px/1 var(--mono); color: var(--text-3); border: 1px solid var(--border-2); padding: 4px 8px; border-radius: 5px; white-space: nowrap; }
  .c-passed > .bb-sym { color: var(--path); border-color: rgba(62,240,200,.35); }
  .c-failed > .bb-sym { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .bb-check b { color: var(--text); font-weight: 500; }
  .bb-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; color: var(--text-3); }
  .bb-chip { font: 400 14px/1 var(--mono); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); background: rgba(255,255,255,.01); }
  .bb-chip.cited { color: var(--path); border-color: rgba(62,240,200,.4); }
  .bb-given { margin-top: 14px; font-size: 17px; color: var(--text-2); }
  .bb-given b { color: var(--text); font-weight: 500; }
  /* Rows: what was given to the AI, what it relied on, one row per passage or file */
  .bb-rows { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .bb-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--border); align-items: start; }
  .bb-row:first-child { border-top: 0; }
  .bb-row .rk { font: 400 15px/1.3 var(--mono); color: var(--text-3); padding-top: 2px; }
  .bb-row .loc { font-size: 18px; font-weight: 500; color: var(--text); display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; line-height: 1.35; }
  .bb-row .face { font: 500 15px/1.3 var(--mono); color: var(--acc); overflow-wrap: anywhere; }
  .bb-row .part { font: 400 13px/1.3 var(--mono); color: var(--text-3); }
  .bb-row .snip { font-size: 16px; line-height: 1.45; color: var(--text-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bb-row .psg + .psg { margin-top: 8px; }
  .bb-row .tags { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 400 13px/1.2 var(--mono); color: var(--text-3); white-space: nowrap; padding-top: 3px; }
  .bb-row .more { font: 400 13px/1.3 var(--mono); color: var(--text-3); margin-top: 6px; }
  .tg { padding: 3px 8px; border-radius: 5px; font: 400 13px/1.2 var(--mono); }
  .tg.rel { color: #0B0C10; background: var(--path); font-weight: 600; }
  .tg.dup { color: var(--person); border: 1px solid color-mix(in srgb, var(--person) 40%, transparent); white-space: nowrap; }
  .bb-row.relied { background: linear-gradient(90deg, rgba(62,240,200,.07), transparent 60%); box-shadow: inset 3px 0 0 var(--path); }
  .bb-row.relied .rk { color: var(--path); }
  .bb-row.found .rk::after { content: " found"; font-size: 12.5px; }
  /* The counts: searched → given → relied on */
  .bb-stats { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 18px; }
  .bb-stat { flex: 1; padding: 12px 16px; border-right: 1px solid var(--border); position: relative; }
  .bb-stat:last-child { border-right: 0; }
  .bb-stat .num { font: 500 30px/1.1 var(--mono); letter-spacing: -.02em; }
  .bb-stat .num.unk { font-size: 18px; color: var(--text-3); }
  .bb-stat .what { font-size: 15px; color: var(--text-3); margin-top: 2px; }
  .bb-stat.g .num { color: var(--acc); } .bb-stat.r .num { color: var(--path); }
  .bb-stat + .bb-stat::before { content: "→"; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); font: 400 13px var(--mono); color: var(--text-3); background: #0D0F14; padding: 2px 0; }
  .bb-countline { font: 400 13px/1.5 var(--mono); color: var(--text-3); margin-top: 10px; }
  .bb-tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .bb-tile { font: 400 14px/1 var(--mono); min-width: 40px; text-align: center; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); color: #8A92A3; background: rgba(255,255,255,.01); cursor: pointer; }
  .bb-tile.file { text-align: left; }
  .bb-tile.more { border-style: dashed; cursor: default; }
  .bb-tile.st-found { color: var(--text-2); border-style: dashed; border-color: color-mix(in srgb, var(--acc) 45%, transparent); }
  .bb-tile.st-given { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--acc) 10%, transparent); }
  .bb-tile sup { font-size: 11px; color: var(--text-3); margin-left: 3px; }
  .bb-tile.relied { color: #0B0C10; background: var(--path); border-color: var(--path); font-weight: 600; }
  .bb-tile.relied sup { color: #0B0C10; }
  .bb-tile.sel { outline: 2px solid var(--text); outline-offset: 2px; }
  .bb-cap { font-size: 15px; color: var(--text-3); margin-top: 10px; line-height: 1.45; }
  .bb-cap b { color: var(--text-2); font-weight: 500; }
  .b-item { margin-top: 12px; font-size: 16px; color: var(--text-2); } .b-item b { color: var(--text); font-weight: 500; }
  .b-item pre.io { max-height: 30vh; font-size: 14px; margin-top: 8px; background: #0B0D12; border-color: var(--border); color: var(--text); }
  /* Proposal (a sign-off's ticket) */
  .bb-proposal { border: 1px solid var(--border-2); border-radius: 12px; overflow: hidden; background: #0C0E13; }
  .bb-proposal.waiting { border-color: color-mix(in srgb, var(--person) 55%, var(--border-2)); }

  .bb-proposal .th b { color: var(--text); font-weight: 500; }
  .bb-proposal .th .ok { margin-left: auto; color: var(--path); } .bb-proposal .th .no { margin-left: auto; color: var(--bad); } .bb-proposal .th .wait { margin-left: auto; color: var(--person); }
  .bb-fields { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; margin: 0; }

  .bb-pdesc { padding: 11px 18px; border-top: 1px solid var(--border); font-size: 18px; color: var(--text); }
  .bb-inapp { margin-top: 12px; font-size: 17px; color: var(--text-2); } .bb-inapp b { color: var(--person); font-weight: 600; }
  .bb-next { margin-top: 12px; display: grid; gap: 4px; font-size: 16px; color: var(--text-2); }
  .bb-next span { font: 400 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); margin-right: 6px; }
  .bb-duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
  .bb-box { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .bb-box .k { font: 400 13px/1.3 var(--mono); color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }

  .bb-storybody .kv .v { font-size: 15px; }

  /* Following the run again, and walking its path: the foot of the detail. */
  .p-follow { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; margin-top: 10px; font: 400 13.5px/1 var(--mono); color: var(--path); padding: 7px 10px; border: 1px solid rgba(62,240,200,.38); border-radius: 7px; white-space: nowrap; }

  .bb-go:hover { color: var(--text); border-color: var(--ac); }
  .bb-go .b { flex: none; font: 600 12.5px/1 var(--mono); color: var(--ac); padding: 4px 6px; border-radius: 5px; background: color-mix(in srgb, var(--ac) 14%, transparent); }
  .p-given { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 45%, transparent); background: color-mix(in srgb, var(--ai) 8%, transparent); }
  .p-given:hover { color: var(--text); border-color: var(--ai); }
  /* The detail at pane width (the bench beside an app): the same card, its type a size down. */
  @container (max-width: 900px) {
    .bb-min { width: 30px; height: 30px; padding: 0; justify-content: center; }

    .bb-num { width: 36px; height: 36px; font-size: 17px; border-radius: 9px; }
    .bb-name { font-size: 23px; }
    .bb-who { font-size: 12.5px; padding: 5px 7px; }
    .bb-tag { font-size: 13px; padding: 6px 9px; }

    .bb-quote { font-size: 16.5px; padding: 12px 16px; }
    .bb-meter { font-size: 13px; } .bb-meter b { font-size: 14.5px; }
    .bb-fields dt { font-size: 13px; padding: 9px 14px; } .bb-fields dd { font-size: 15.5px; padding: 9px 14px; }
    .bb-proposal .th { font-size: 13px; padding: 10px 14px; }

<body>
<div id="controls">
  <button id="cBack" title="Back one step">◂</button>
  <button id="cPlay">Pause</button>
  <button id="cNext" title="Forward one step">▸</button>
  <button id="cRestart">Restart</button>
  <button id="cEnd">Skip to end</button>
  <label class="muted">speed <select id="cSpeed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
  <label class="muted" title="Play stops by itself at decisions, checks and sign-offs"><input type="checkbox" id="cAuto" checked> pause at moments</label>
  <span class="muted" id="cSrc"></span>
</div>
<div id="bench"></div>
<!-- logic.js is an ES module (node --test imports it too); layout.js, bench.js and sources.js stay
     classic scripts, so a page that only wants BenchLayout loads layout.js alone. Module scripts run
     in document order, after the classic layout.js. -->
<script src="viewer/layout.js"></script>
<script type="module">
  import * as BenchLogic from './viewer/logic.js';
  window.BenchLogic = BenchLogic;
</script>
<script type="module" src="viewer/bench.js"></script>
<script type="module" src="viewer/sources.js"></script>
<script type="module">
(function () {
  var q = new URLSearchParams(location.search);
  // The directory this page is served from (a query string may contain slashes, so not a regex on the URL).
  var base = new URL('./', document.baseURI).href;
  var replay = q.get('replay');
  var source = q.get('source') === 'parent' ? 'parent' : replay ? 'replay' : 'live';
  var ctl = document.getElementById('controls');
  var bench = new Bench(document.getElementById('bench'), {
    source: source,
    onmode: function (m) { ctl.classList.toggle('hide', m === 'presentation'); }
  });
  bench.mountControls(ctl);   // under the shared bar: the mode switch stays the first row's

  function getJSON(url) { return fetch(url).then(function (r) { if (!r.ok) { var e = new Error(url + ': ' + r.status); e.status = r.status; throw e; } return r.json(); }); }
  function getText(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ': ' + r.status); return r.text(); }); }
  function fail(msg) { document.getElementById('bench').innerHTML = '<div id="picker"><p style="color:var(--bad)">' + msg + '</p></div>'; }
  function withParams(changes) {
    var u = new URLSearchParams(location.search);
    Object.keys(changes).forEach(function (k) { if (changes[k] == null) u.delete(k); else u.set(k, changes[k]); });
    return '?' + u.toString();
  }

  // ?missing=null: an app with no registered map gets a 200 null (Level 0), not a 404 in the console.
  var topoUrl = q.get('topology') || (q.get('app') ? base + 'topology/' + encodeURIComponent(q.get('app')) + '?missing=null' : null);

  if (source === 'parent') {
    // Embedded sync: the map, story and events all arrive from the app via the shell.
    new BenchSources.ParentSource(bench).start();
  } else if (replay) {
    // A recording carries its app's map and story in its first line (SPEC section 3), so a
    // replay needs no receiver and no registration: it works from a static export.
    ctl.classList.add('on');
    document.getElementById('cSrc').textContent = replay.split('/').pop();
    getText(replay).then(function (text) {
      var rec = BenchSources.parseRecording(text);
      var topo = rec.header && rec.header.topology;
      return (topo ? Promise.resolve(topo) : getJSON(topoUrl)).then(function (t) {
        bench.setTopology(t);
        if (rec.header && rec.header.story) bench.loadStory(t.app.id, rec.header.story);
        offerOthers(t);
        return rec.events.map(BenchLogic.normalizeEvent);
      });
    }).then(function (events) {
      var btn = document.getElementById('cPlay');
      var src = new BenchSources.ReplaySource(bench, events, {
        speed: Number(q.get('speed') || 1),
        stops: BenchLogic.cursorStops(BenchLogic.sortEvents(events), bench.topo),
        autoPause: q.get('pause') !== '0',
        onstate: function (s) {
          btn.textContent = s === 'playing' ? 'Pause' : s === 'done' ? 'Replay' : s === 'moment' ? 'Continue' : 'Play';
          bench.setTransportState(s);
        }
      });
      bench.setTransport({
        back: function () { src.back(); }, next: function () { src.next(); }, restart: function () { src.start(); },
        play: function () { src.play(); }, pause: function () { src.pause(); },
        first: function () { src.first(); }, end: function () { src.finish(); }
      });
      btn.onclick = function () { if (src.playing) src.pause(); else src.play(); };
      document.getElementById('cBack').onclick = function () { src.back(); };
      document.getElementById('cNext').onclick = function () { src.next(); };
      document.getElementById('cRestart').onclick = function () { src.start(); };
      document.getElementById('cEnd').onclick = function () { src.finish(); };
      document.getElementById('cSpeed').value = String(src.speed);
      document.getElementById('cSpeed').onchange = function (e) { src.speed = Number(e.target.value); };
      document.getElementById('cAuto').checked = src.autoPause;
      document.getElementById('cAuto').onchange = function (e) { src.autoPause = e.target.checked; };
      // A recording opens paused on its first step, so a presenter can talk first and step with a
      // clicker (&play=1 plays it instead). A deep link: ?at=<node> opens paused where that step
      // stops (a sign-off at "waiting"), ?at=end at the end; &recap=1 then opens the recap.
      var at = q.get('at'), stop = at && at !== 'end' ? BenchLogic.stopAt(BenchLogic.sortEvents(events), bench.topo, at) : -1;
      if (at === 'end') src.finish();
      else if (stop >= 0) src.seek(stop);
      else if (q.get('play') === '1') src.start();
      else src.first();
      if (q.get('recap') === '1') bench.openRecap(true);
    }).catch(function (e) { fail('Could not load the recording: ' + e.message); });
  } else if (topoUrl) {
    getJSON(topoUrl).then(function (t) {
      if (t === null && q.get('app')) { var e404 = new Error('no map'); e404.status = 404; throw e404; }
      bench.setTopology(t);
      // A library app's map names its story by hash; the bench serves the trusted file only on a match.
      if (t.story) bench.loadStory(t.app.id, null, base, typeof t.story === 'object' ? t.story.sha256 : null);
      bench.useRunMaps(base);
      new BenchSources.LiveSource(bench, base, q.get('session'), q.get('app')).start();
    }).catch(function (e) {
      // Level 0: the app sends spans but never registered a map. Draw one from what arrives.
      if (e.status === 404 && q.get('app')) {
        bench.useInferredMap(q.get('app'));
        bench.useRunMaps(base);           // a run that does carry a map replaces the inferred one
        new BenchSources.LiveSource(bench, base, q.get('session'), q.get('app')).start();
      } else fail('Could not load the map for this app: ' + e.message + '. Has the app registered with the bench?');
    });
  } else {
    // No app named: list the apps that registered, plus recordings listed in recordings.json
    // (a static export has no receiver, so a failed /topologies just means "recordings only").
    Promise.all([
      getJSON(base + 'topologies').catch(function () { return null; }),
      getJSON(base + 'recordings.json').catch(function () { return []; })
    ]).then(function (res) {
      var apps = res[0], recs = res[1], esc = BenchLogic.esc;
      document.getElementById('bench').innerHTML = '<div id="picker"><p><a href="../">↑ Up</a></p><h3>Bench</h3>' +
        (apps ? '<p class="muted">Live, per registered app (add &amp;session=&lt;id&gt; to filter):</p>' +
          (apps.length ? apps.map(function (a) { return '<div><a href="?app=' + encodeURIComponent(a.id) + '">' + esc(a.name) + '</a>' + (a.story ? ' <span class="muted">· story</span>' : '') + (a.inferred ? ' <span class="muted">· no map registered: the bench infers one</span>' : '') + '</div>'; }).join('')
                       : '<div class="muted">none yet: an app registers with PUT /apps/&lt;id&gt;</div>') : '') +
        '<p class="muted" style="margin-top:16px">Recordings:</p>' +
        recs.map(function (r) { return '<div><a href="?replay=' + encodeURIComponent(r.path) + '">' + esc(r.title) + '</a>' + (r.group ? ' <span class="muted">· ' + esc(r.group) + '</span>' : '') + '</div>'; }).join('') + '</div>';
    });
  }

  /* "Try another request": the same app's other recordings, grouped and titled from their
     headers; and, for a run with a gate, the paired recording that went the other way. */
  function offerOthers(topo) {
    getJSON(base + 'recordings.json').catch(function () { return []; }).then(function (recs) {
      var mine = recs.filter(function (r) {
        return r.app ? r.app === topo.app.id : String(r.title || '').indexOf(topo.app.name + ' · ') === 0;
      }).map(function (r) {
        return { path: r.path, group: r.group || '', title: r.plain_title || String(r.title || r.path).replace(topo.app.name + ' · ', '') };
      });
      var cur = mine.filter(function (r) { return r.path === replay; })[0] ? replay : (mine.filter(function (r) { return replay.slice(-r.path.length) === r.path; })[0] || {}).path;
      // Another request starts at its own beginning: the step and recap of this one don't carry over.
      bench.setPicker(mine, cur, function (path) { location.search = withParams({ replay: path, at: null, recap: null }); });
      var m = /-(approved|denied)(\.recording\.jsonl)$/.exec(cur || replay);
      if (!m) return;
      var other = m[1] === 'approved' ? 'denied' : 'approved';
      var twin = (cur || replay).replace(m[0], '-' + other + m[2]);
      if (mine.some(function (r) { return r.path === twin; })) {
        bench.setPair({ href: withParams({ replay: twin, at: null, recap: null }), text: other === 'denied' ? 'See what happens if they deny ▸' : 'See what happens if they approve ▸' });
      }
    });
  }
})();
</script>
</body>
</html>
