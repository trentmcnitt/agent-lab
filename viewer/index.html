<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Bench</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171d2c; --panel-2: #1e2740; --border: #2a3350; --text: #e6ebff; --muted: #8a93b8;
    --accent: #5eead4; --accent-2: #a78bfa; --warn: #fbbf24; --bad: #fb7185; --good: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); }
  #bench { display: flex; flex-direction: column; height: 100vh; }
  #bench > .eng, #bench > .pres { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .mode-presentation > .eng, .mode-engineering > .pres { display: none !important; }

  .bh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .bh .app { font-weight: 600; font-size: 13.5px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--good); border-color: var(--good); }
  .badge.warn { color: var(--warn); border-color: var(--warn); }
  .badge.rep { color: var(--accent-2); border-color: var(--accent-2); }
  .bh select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; padding: 2px 4px; max-width: 260px; }
  .bh-spacer { flex: 1; }
  .viewtoggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .viewtoggle button { background: none; border: none; color: var(--muted); font: 600 11.5px -apple-system, sans-serif; padding: 4px 11px; cursor: pointer; }
  .viewtoggle button + button { border-left: 1px solid var(--border); }
  .viewtoggle button.on { background: rgba(94,234,212,.12); color: var(--accent); }
  .meterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 11.5px; color: var(--muted); }
  .meterbar b { color: var(--accent); font-weight: 600; }
  .meterbar .status { margin-left: auto; }
  .stitle b { color: var(--text); font-weight: 600; letter-spacing: .08em; }
  .stitle span { text-transform: none; letter-spacing: 0; font-size: 11px; margin-left: 6px; }
  .stephead { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 2px; }
  .stephead .tag { margin-left: auto; }
  .stepstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin: 6px 0; }
  .stepstats b { color: var(--text); font-weight: 600; }
  .stepresult { font-size: 12.5px; color: var(--accent); margin: 4px 0 2px; }
  .status { padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; }
  .st-ok { color: var(--good); } .st-error { color: var(--bad); } .st-aborted { color: var(--warn); } .st-running { color: var(--accent); } .st-waiting { color: var(--warn); }

  #controls { display: none; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; }
  #controls.on { display: flex; flex-wrap: wrap; }
  #controls.on.hide { display: none; }
  #controls button, #controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  #controls button:hover { border-color: var(--accent); }

  .bgrid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(300px, 1fr); }
  .col { overflow: auto; padding: 10px 12px; border-right: 1px solid var(--border); }
  .col:last-child { border-right: none; }
  .stitle { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 4px 0 6px; }
  .stitle + * { margin-bottom: 12px; }

  .graphwrap { overflow-x: auto; }
  .graph { position: relative; margin: 0 auto; }
  .graph svg.edges { position: absolute; left: 0; top: 0; color: var(--border); overflow: visible; }
  .edge path { fill: none; stroke: currentColor; stroke-width: 1.4; }
  .edge text { fill: var(--muted); font: 9.5px ui-monospace, monospace; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .edge.taken { color: var(--accent); } .edge.taken path { stroke-width: 2.2; } .edge.taken text { fill: var(--accent); }
  .edge.flowing path { stroke-dasharray: 6 5; animation: flow .6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -11; } }
  .edge.untaken { opacity: .45; } .edge.untaken path { stroke-dasharray: 3 3; }
  .gnode { position: absolute; border: 1px solid var(--border); background: #1e2740; border-radius: 7px; padding: 4px 8px; cursor: pointer; transition: all .25s ease; color: var(--muted); overflow: hidden; }
  .gnode .gl { font: 12px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gnode .gm { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gnode .gp { font-size: 10.5px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .gnode.kind-llm .gl::before { content: "◆ "; color: var(--accent-2); }
  .gnode.kind-gate .gl::before { content: "⏸ "; color: var(--warn); }
  .gnode.kind-tool .gl::before { content: "⚙ "; }
  .gnode.kind-retrieval .gl::before { content: "⌕ "; }
  .gnode.kind-check .gl::before { content: "✓ "; color: #93c5fd; }
  .gnode.idle { opacity: .55; }
  .gnode.done { color: var(--text); border-color: var(--accent-2); background: #2a2550; }
  .gnode.done .gm { color: var(--text); }
  .gnode.active { color: #06201c; background: #5eead4; border-color: var(--accent); box-shadow: 0 0 14px rgba(94,234,212,.5); }
  .gnode.active .gm, .gnode.active .gl::before { color: #06201c; }
  .gnode.gatewait { color: var(--text); border-color: var(--warn); background: #3a3524; box-shadow: 0 0 14px rgba(251,191,36,.35); animation: pulse 1.4s ease-in-out infinite; }
  .gnode.error { color: var(--text); border-color: var(--bad); background: #3a2230; }
  .gnode.untaken { border-style: dashed; opacity: .5; }
  .gnode.skipped { border-style: dotted; opacity: .6; color: var(--muted); }
  .gnode.skipped .gl::after { content: "  · skipped"; font-size: 10px; }
  .gnode.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
  @keyframes pulse { 50% { box-shadow: 0 0 4px rgba(251,191,36,.2); } }
  .unmapped { margin-top: 6px; font-size: 11.5px; }

  .wrow { display: grid; grid-template-columns: 118px 1fr 62px; gap: 6px; align-items: center; font-size: 11px; height: 17px; }
  .wrow.child .wl { padding-left: 10px; }
  .wl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .wtrack { position: relative; height: 9px; background: rgba(42,51,80,.45); border-radius: 3px; }
  .wbar { position: absolute; top: 0; bottom: 0; background: var(--accent-2); border-radius: 3px; min-width: 2px; }
  .wbar.inferred { opacity: .55; }
  .wbar.gate { background: var(--warn); }
  .wbar.error { background: var(--bad); }
  .wbar.skipped { background: transparent; border: 1px dotted var(--muted); }
  .wbar.open { background: var(--accent); animation: pulse 1.2s infinite; }
  .wv { text-align: right; color: var(--text); }
  .legend { font-size: 10.5px; margin-top: 4px; }

  .panel { background: rgba(30,39,64,.68); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .panel.empty { opacity: .55; }
  .ptitle { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
  .pcount { color: var(--accent); }
  .pright { display: flex; gap: 6px; align-items: center; }
  .rawbtn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font: 9.5px ui-monospace, monospace; padding: 0 5px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .rawbtn:hover { border-color: var(--accent); color: var(--text); }
  .rawbtn.on { color: var(--accent); border-color: var(--accent); }
  .panel.storied { border-color: rgba(167,139,250,.45); }
  .iolabel { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-2); margin: 8px 0 3px; }
  pre.io { margin: 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 11px/1.45 ui-monospace, monospace; background: #111726; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; color: var(--text); }
  pre.io.out { border-color: var(--accent); }
  details.hit > summary { cursor: pointer; list-style: none; }
  details.hit > summary::-webkit-details-marker { display: none; }
  details.hit > summary::before { content: '▸'; color: var(--muted); margin-right: 2px; }
  details.hit[open] > summary::before { content: '▾'; color: var(--accent); }
  .iotabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
  .iotab { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font: 10.5px ui-monospace, monospace; padding: 1px 7px; cursor: pointer; }
  .iotab.on { color: var(--accent); border-color: var(--accent); }
  .pev + .pev { border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 4px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 2px 0; border-bottom: 1px dashed rgba(42,51,80,.7); }
  .kv .k { color: var(--muted); white-space: nowrap; }
  .kv .v { text-align: right; overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 11px; }
  .kv.hi .v { color: var(--accent); font-weight: 600; }
  .row { font-size: 11.5px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; padding: 2px 0; }
  .row .right { margin-left: auto; color: var(--muted); }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--border); color: var(--accent-2); font-family: ui-monospace, monospace; }
  .src { font-size: 9.5px; padding: 0 4px; border-radius: 6px; border: 1px solid currentColor; }
  .src-actual { color: var(--good); } .src-estimated { color: var(--warn); }
  .note { margin-top: 4px; color: var(--muted); font-size: 11.5px; }
  .note.quote { color: var(--text); border-left: 2px solid var(--border); padding-left: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .note.out { border-left-color: var(--accent); }
  .gate { font-size: 12px; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; }
  .gate.waiting { background: rgba(251,191,36,.16); border: 1px solid var(--warn); }
  .gate.ok { color: var(--good); } .gate.bad { color: var(--bad); }
  .err { color: var(--bad); font-size: 12px; }
  .mc + .mc { border-top: 1px dashed var(--border); margin-top: 5px; padding-top: 5px; }
  .mc { font-size: 11.5px; } .mc-error b { color: var(--bad); } .mc-warning b { color: var(--warn); } .mc-info b { color: var(--muted); }

  .logcol { flex: 0 0 26%; min-height: 110px; border-top: 1px solid var(--border); padding: 6px 12px; overflow: auto; background: var(--panel); }
  .log { font-size: 10.5px; }
  .lrow { display: grid; grid-template-columns: 28px 64px 120px 128px 1fr; gap: 6px; padding: 1px 0; border-bottom: 1px solid rgba(42,51,80,.5); }
  .lrow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .ls, .lrow .lt { color: var(--muted); text-align: right; }
  .lrow .le { color: var(--accent-2); }
  .lrow .ld { color: var(--muted); }
  .lrow.t-llm_call .le { color: var(--accent); } .lrow.t-error .le { color: var(--bad); } .lrow.t-gate_waiting .le, .lrow.t-gate_resolved .le { color: var(--warn); }

  .aud { color: var(--accent-2); font-size: 9.5px; }
  .ck { font-size: 11.5px; white-space: nowrap; }
  .ck-passed, .c-passed { color: var(--good); } .ck-failed, .c-failed { color: var(--bad); } .ck-not_on_path, .ck-pending, .c-not_on_path, .c-pending { color: var(--muted); } .ck-ran, .ck-running { color: var(--accent); }
  .srcblock + .srcblock { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 6px; }
  .tiles { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
  .tile { min-width: 24px; height: 22px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--muted); font: 11px ui-monospace, monospace; cursor: pointer; opacity: .7; }
  .tile.st-found { border-color: var(--accent-2); color: var(--text); opacity: 1; }
  .tile.st-given { background: rgba(94,234,212,.16); border-color: var(--accent); color: var(--accent); opacity: 1; }
  .tile.relied { background: var(--accent); color: #06201c; box-shadow: 0 0 7px rgba(94,234,212,.55); }
  .tile.sel { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .legend .tile { cursor: default; display: inline-block; min-width: 0; width: 13px; height: 11px; padding: 0; vertical-align: -1px; margin: 0 3px 0 8px; font-size: 0; }

  /* ---- Presentation: the stage (Build spec v3, the A+B hybrid) ----------------------------------
     The map is the stage; one callout bubble, joined to its step by a wedge, explains that step.
     Sizes are set for a projector at 1920×1080 (body 22px, labels 18px) and scale down with the
     window; the map itself is drawn at layout.js's STAGE_GEOM (or PANE_GEOM, ≤ ~960) and fitted. */
  .pres {
    --fs: clamp(16px, 1.146vw, 22px); --fs-head: clamp(20px, 1.5625vw, 30px); --fs-label: clamp(13px, .9375vw, 18px);
    --fs-small: clamp(14px, .9375vw, 18px); --fs-req: clamp(16px, 1.25vw, 24px);
    --stage: #0c111c; --bub: #182039; --bub-2: #121a2e; --line: #2c3757; --dim: #6b7599;
    --a-app: #7cc4fa; --a-ai: #a78bfa; --a-rule: #5eead4; --a-person: #fbbf24;
    position: relative; background: var(--stage);
    background-image: radial-gradient(rgba(138,147,184,.09) 1px, transparent 1.2px); background-size: 22px 22px;
  }
  .a-app { --ac: var(--a-app); } .a-ai { --ac: var(--a-ai); } .a-rule { --ac: var(--a-rule); } .a-person { --ac: var(--a-person); }
  .ps-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 28px; align-items: center; padding: 12px 28px; border-bottom: 1px solid var(--border); background: rgba(15,20,32,.92); }
  .ps-brand { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-small); color: var(--muted); max-width: 22vw; }
  .ps-brand .p-appname { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-modename { font-size: var(--fs-label); letter-spacing: .04em; }
  .ps-ask { min-width: 0; }
  .ps-who { font-size: var(--fs-small); color: var(--muted); font-weight: 600; }
  .ps-who:empty { display: none; }
  /* The whole request, never cut (a trick at its end is the point of some runs); long ones set smaller. */
  .ps-req { font-size: var(--fs-req); line-height: 1.3; }
  .ps-req.r-long { font-size: calc(var(--fs-req) * .8); } .ps-req.r-xlong { font-size: calc(var(--fs-req) * .66); line-height: 1.25; }
  .ps-req:empty { display: none; }
  .ps-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ps-tools { display: flex; align-items: center; gap: 8px; }
  .ps-pill { display: inline-flex; align-items: center; gap: 10px; padding: 7px 18px; border-radius: 999px; border: 1.5px solid currentColor; font: 600 var(--fs)/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; white-space: nowrap; }
  .ps-pill i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
  .ps-pill.st-running { color: var(--accent); } .ps-pill.st-running i { animation: pulse 1.2s infinite; }
  .ps-pill.st-paused { color: var(--accent-2); } .ps-pill.st-waiting { color: var(--warn); background: rgba(251,191,36,.08); }
  .ps-pill.st-ok { color: var(--good); } .ps-pill.st-handed { color: var(--a-app); } .ps-pill.st-bad { color: var(--bad); } .ps-pill.st-idle { color: var(--muted); }

  .ps-stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; gap: 40px; padding: 18px 28px; }
  .ps-wedge, .ps-seam { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .ps-wedge { z-index: 0; } .ps-seam { z-index: 3; }
  .ps-wedge .w-fill, .ps-seam .w-fill { fill: var(--bub); }
  .ps-wedge .w-edge, .ps-seam .w-edge { fill: none; stroke: var(--ac); stroke-width: 2; }
  .ps-map { position: relative; z-index: 1; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; }
  .ps-map .graphwrap { overflow: visible; }
  .ps-side { position: relative; z-index: 2; flex: 0 0 min(900px, 48%); min-height: 0; display: flex; flex-direction: column; }
  .ps-bubble { flex: none; max-height: 100%; overflow: auto; transition: margin-top .25s ease; border-radius: 16px; }
  .p-maponly .ps-side, .p-maponly .ps-wedge, .p-maponly .ps-seam { display: none; }

  /* The map's boxes: an actor stripe, a plain name (two lines at most), its actor, one badge. */
  .snode { overflow: visible; background: #151c2f; border: 1.5px solid #252f4b; border-left: 6px solid color-mix(in srgb, var(--ac) 45%, #252f4b); border-radius: 10px;
           padding: 9px 12px 8px 24px; color: #69739a; display: flex; flex-direction: column; justify-content: space-between; opacity: 1; }
  .snode { transition: box-shadow .25s ease, border-color .25s ease, background-color .25s ease; }
  .snode .s-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; min-width: 0; }
  .snode .gl { font: 600 22px/1.16 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .snode .gl::before { content: none !important; }
  .snode .actor { flex: none; font-size: 20px; padding: 4px 8px; margin-top: 2px; color: color-mix(in srgb, var(--ac) 70%, #69739a); border-color: currentColor; }
  .snode .s-badge { display: flex; }
  .snode .s-badge[hidden] { display: none; }
  .snode .gp { display: inline-flex; align-items: center; font: 600 20px/1 -apple-system, BlinkMacSystemFont, sans-serif; padding: 4px 11px; border-radius: 999px; margin: 0;
               color: #8ff3e2; background: rgba(94,234,212,.1); border: 1px solid rgba(94,234,212,.38); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .s-num { position: absolute; left: -18px; top: -18px; width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
           font: 700 21px/1 -apple-system, BlinkMacSystemFont, sans-serif; background: #0c111c; color: #fff; border: 2.5px solid var(--ac); z-index: 2; }
  .s-num[hidden] { display: none; }
  .snode.idle { color: #69739a; }
  .snode.untaken { color: #4f5878; border-style: dashed; border-left-style: solid; background: #121828; }
  .snode.untaken .actor { color: #4f5878; }
  .snode.done, .snode.active { color: var(--text); background: #1b2442; border-color: #36426c; border-left-color: var(--ac); }
  .snode.done .actor, .snode.active .actor { color: var(--ac); }
  .snode.starting { color: #cfd6f5; border-style: dashed; border-color: var(--ac); border-left-style: solid; }
  .snode.skipped { border-style: dotted; }
  .snode.error { border-color: var(--bad); }
  .snode.gatewait { color: var(--text); background: #2c2a24; border-color: var(--warn); }
  .snode.focus { color: #fff; background: #222c50; border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac), 0 0 30px color-mix(in srgb, var(--ac) 45%, transparent); }
  .snode.focus .s-num { background: var(--ac); color: #0b1020; }
  .snode.selected { outline: none; }
  .ps-map .edge path { stroke-width: 2; }
  .ps-map .graph svg.edges { color: #2f3a5c; }
  .ps-map .edge.taken { color: var(--accent); } .ps-map .edge.taken path { stroke-width: 4; }
  .ps-map .edge.untaken { opacity: .55; } .ps-map .edge.untaken path { stroke-dasharray: 6 6; }
  .ps-map .edge .hit { stroke-width: 16; }
  .ps-pane .snode .gl { font-size: 16px; }
  .ps-pane .snode .actor { display: none; }
  .ps-pane .snode .gp { font-size: 14px; padding: 3px 8px; }
  .ps-pane .snode { padding: 6px 9px 6px 17px; border-left-width: 5px; }
  .ps-pane .s-num { width: 26px; height: 26px; left: -12px; top: -12px; font-size: 14px; border-width: 2px; }

  /* The callout. */
  .bb { background: var(--bub); border: 2px solid var(--ac); border-radius: 16px; padding: 18px 24px 20px; font-size: var(--fs); line-height: 1.38; color: var(--text); }
  .bb-empty { --ac: var(--line); }

  .bb-storybody .kv .v { font-size: var(--fs-small); }

  /* The recap: the four questions. */
  .rc .rc-k { font-size: var(--fs-label); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .bb.rc { --ac: var(--line); }
  .rc-q { padding: 12px 0; border-bottom: 1px solid rgba(138,147,184,.16); }

  .rc-a { margin: 0 0 6px; }

  .rc-step { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 5px; border-radius: 999px; border: 1.5px solid var(--ac); color: var(--text); }

  .rc-never, .rc-record { margin: 12px 0 0; font-size: var(--fs-small); color: #b5bddc; } .rc-never span, .rc-record span { color: var(--muted); }
  .rc-why { margin-top: 10px; font-size: var(--fs-small); } .rc-why > span { color: var(--muted); display: block; margin-bottom: 4px; }

  .ps-keys kbd { font: 700 var(--fs-small) ui-monospace, monospace; color: var(--accent); } .ps-keys { --ac: var(--accent); }
  .ps-pane .bb-legend .lg-r { display: none; }   /* the pane's tiles show no ranks */
  .bb-legend .lg-rank { font-weight: 800; font-size: .85em; background: var(--a-ai); color: #0b1020; border-radius: 5px; padding: 1px 4px; margin-right: 6px; }
  .bb-counts span.unk { font-size: var(--fs-small); color: var(--muted); }

  /* The footer: time, cost in words, by hand or what it can never do; the presenter's controls. */
  .ps-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap; padding: 10px 28px; border-top: 1px solid var(--border); background: rgba(15,20,32,.92); font-size: var(--fs-small); }
  .ps-facts { min-width: 0; flex: 1 1 400px; } .ps-facts .sep { color: var(--muted); margin: 0 4px; }
  /* Always two lines tall, so the stage doesn't move when the footer grows (and nothing in it is cut). */
  .ps-facts { min-height: calc(2 * 1.35em); display: flex; align-items: center; } .p-bline { line-height: 1.35; }
  .ps-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .p-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .p-pick select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; padding: 3px 4px; max-width: 220px; }
  .p-inferred { font-size: 12px; border: 1px dashed var(--muted); border-radius: 10px; padding: 0 7px; color: var(--muted); }
  .p-appname:empty { display: none; }
  .actor { font: 600 9px/1.3 -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 8px; border: 1px solid currentColor; white-space: nowrap; }
  /* Pills and chips: center the text inside the border. A font's line box leaves room for

     with line-height 1 as the fallback where text-box isn't supported. */

  .actor[hidden], .tag[hidden], .badge[hidden], .src[hidden], .p-inferred[hidden], .status[hidden], .rawbtn[hidden], .iotab[hidden] { display: none; }
  @supports (text-box: trim-both cap alphabetic) {
    .actor, .tag, .badge, .src, .p-inferred, .status, .gp, .bb-chip { text-box: trim-both cap alphabetic; padding-top: 3px; padding-bottom: 3px; }
    .actor { padding-top: 3.5px; padding-bottom: 3.5px; }

    .ps-pane .snode .gp { padding-top: 4px; padding-bottom: 4px; }
  }
  .actor-ai { color: var(--accent-2); } .actor-rule { color: #93c5fd; } .actor-person { color: var(--warn); } .actor-app { color: var(--muted); }

  .edgetip b { color: var(--accent-2); display: block; margin-bottom: 2px; }

  .g-panel { max-width: 940px; margin: 0 auto; padding: 0 14px 20px; }
  .g-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 0 8px; background: var(--bg); border-bottom: 1px solid var(--border); }
  .g-head b { font-size: 15px; } .g-head .muted { font-size: 12px; }

  .p-close:hover { border-color: var(--accent); }
  .g-note { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
  .g-call { margin-top: 14px; } .g-call h4 { margin: 0 0 4px; font-size: 13px; color: var(--accent-2); }

  .g-text { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #111726; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); }
  .g-output .g-text { border-color: var(--accent); }

  .hltag { display: block; font: 600 10.5px -apple-system, sans-serif; color: var(--accent); margin: 6px 0 1px; }
  mark.g-key { background: rgba(94,234,212,.13); color: var(--text); border-bottom: 1px solid rgba(94,234,212,.6); padding: 0 3px; }
  .g-big { margin-left: auto; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
  .g-big:hover { color: var(--text); border-color: var(--accent); }
  .g-head .g-big + .p-close { margin-left: 0; }
  .g-fields { display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 4px 14px; margin: 4px 0 0; padding: 8px 10px; background: #111726; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; }
  .g-fields dt { color: var(--accent-2); font-weight: 600; text-transform: capitalize; }
  .g-fields dd { margin: 0; overflow-wrap: anywhere; }
  .g-answer { border-color: var(--accent); }
  .g-raw summary { cursor: pointer; color: var(--muted); font-size: 11.5px; margin: 4px 0; }
  .g-panel.big .g-text { font-size: 15px; } .g-panel.big .g-fields { font-size: 15px; } .g-panel.big .g-call h4 { font-size: 16px; }
  .g-choices { color: var(--muted); margin-top: 2px; } .g-choices b { color: var(--text); font-weight: 600; }
  .hlwrap.relied mark { background: rgba(251,191,36,.16); border-bottom-color: var(--warn); } .hlwrap.relied .hltag { color: var(--warn); }
  mark.g-key.relied { background: rgba(251,191,36,.16); border-bottom-color: var(--warn); }
  /* In Presentation the panel is read from across a room: the screen's width, larger type, and

  .pres .g-panel { max-width: min(1600px, 96vw); padding: 0 24px 28px; }
  .pres .g-head b { font-size: var(--fs-head); } .pres .g-head .muted, .pres .g-note, .pres .g-raw summary, .pres .p-close, .pres .g-big { font-size: var(--fs-small); }
  .pres .g-call h4 { font-size: var(--fs); } .pres .g-role, .pres .hltag { font-size: var(--fs-label); }
  .pres .g-text { font-size: calc(var(--fs) * .8); } .pres .g-fields { font-size: var(--fs); }
  .pres .g-panel.big .g-text { font-size: var(--fs); } .pres .g-panel.big .g-fields, .pres .g-panel.big .g-call h4 { font-size: calc(var(--fs) * 1.25); }
  .pres .g-panel.big .g-role, .pres .g-panel.big .hltag, .pres .g-panel.big .g-note, .pres .g-panel.big .g-head .muted { font-size: var(--fs); }
  .badge.dl { background: none; cursor: pointer; color: var(--accent); border-color: var(--accent); font: 11px -apple-system, sans-serif; }

  /* A ~960 px pane (the bench beside an app): the same stage, tighter. */
  @media (max-width: 1100px) {
    .ps-head { padding: 10px 16px; gap: 6px 16px; }
    .ps-brand { display: none; }

  #picker { padding: 24px; max-width: 640px; }
  #picker a { color: var(--accent); }

  /* Narrow (a phone, or the bench beside an app in the shell): one scrolling page, not
     three scroll boxes, so the graph and panels keep their natural height. */
  @media (max-width: 820px) {
    #bench.mode-engineering { height: auto; min-height: 100vh; }
    .bgrid { display: block; }
    .col { overflow: visible; border-right: none; border-bottom: 1px solid var(--border); }
    .logcol { flex: none; max-height: none; overflow: visible; }
    #bench > .eng { flex: none; }
    .lrow { grid-template-columns: 24px 52px 90px 1fr; } .lrow .ld { display: none; }
  }
</style>
</head>
<body>
<div id="controls">
  <button id="cBack" title="Back one step">◂</button>
  <button id="cPlay">Pause</button>
  <button id="cNext" title="Forward one step">▸</button>
  <button id="cRestart">Restart</button>
  <button id="cEnd">Skip to end</button>
  <label class="muted">speed <select id="cSpeed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select></label>
  <label class="muted" title="Play stops by itself at decisions, checks and sign-offs"><input type="checkbox" id="cAuto" checked> pause at moments</label>
  <span class="muted" id="cSrc"></span>
</div>
<div id="bench"></div>
<!-- logic.js is an ES module (node --test imports it too); layout.js, bench.js and sources.js stay
     classic scripts, so a page that only wants BenchLayout loads layout.js alone. Module scripts run
     in document order, after the classic layout.js. -->
<script src="viewer/layout.js"></script>
<script type="module">
  import * as BenchLogic from './viewer/logic.js';
  window.BenchLogic = BenchLogic;
</script>
<script type="module" src="viewer/bench.js"></script>
<script type="module" src="viewer/sources.js"></script>
<script type="module">
(function () {
  var q = new URLSearchParams(location.search);
  // The directory this page is served from (a query string may contain slashes, so not a regex on the URL).
  var base = new URL('./', document.baseURI).href;
  var replay = q.get('replay');
  var source = q.get('source') === 'parent' ? 'parent' : replay ? 'replay' : 'live';
  var ctl = document.getElementById('controls');
  var bench = new Bench(document.getElementById('bench'), {
    source: source,
    onmode: function (m) { ctl.classList.toggle('hide', m === 'presentation'); }
  });

  function getJSON(url) { return fetch(url).then(function (r) { if (!r.ok) { var e = new Error(url + ': ' + r.status); e.status = r.status; throw e; } return r.json(); }); }
  function getText(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ': ' + r.status); return r.text(); }); }
  function fail(msg) { document.getElementById('bench').innerHTML = '<div id="picker"><p style="color:var(--bad)">' + msg + '</p></div>'; }
  function withParams(changes) {
    var u = new URLSearchParams(location.search);
    Object.keys(changes).forEach(function (k) { if (changes[k] == null) u.delete(k); else u.set(k, changes[k]); });
    return '?' + u.toString();
  }

  // ?missing=null: an app with no registered map gets a 200 null (Level 0), not a 404 in the console.
  var topoUrl = q.get('topology') || (q.get('app') ? base + 'topology/' + encodeURIComponent(q.get('app')) + '?missing=null' : null);

  if (source === 'parent') {
    // Embedded sync: the map, story and events all arrive from the app via the shell.
    new BenchSources.ParentSource(bench).start();
  } else if (replay) {
    // A recording carries its app's map and story in its first line (SPEC section 3), so a
    // replay needs no receiver and no registration: it works from a static export.
    ctl.classList.add('on');
    document.getElementById('cSrc').textContent = replay.split('/').pop();
    getText(replay).then(function (text) {
      var rec = BenchSources.parseRecording(text);
      var topo = rec.header && rec.header.topology;
      return (topo ? Promise.resolve(topo) : getJSON(topoUrl)).then(function (t) {
        bench.setTopology(t);
        if (rec.header && rec.header.story) bench.loadStory(t.app.id, rec.header.story);
        offerOthers(t);
        return rec.events.map(BenchLogic.normalizeEvent);
      });
    }).then(function (events) {
      var btn = document.getElementById('cPlay');
      var src = new BenchSources.ReplaySource(bench, events, {
        speed: Number(q.get('speed') || 1),
        stops: BenchLogic.cursorStops(BenchLogic.sortEvents(events), bench.topo),
        autoPause: q.get('pause') !== '0',
        onstate: function (s) {
          btn.textContent = s === 'playing' ? 'Pause' : s === 'done' ? 'Replay' : s === 'moment' ? 'Continue' : 'Play';
          bench.setTransportState(s);
        }
      });
      bench.setTransport({
        back: function () { src.back(); }, next: function () { src.next(); }, restart: function () { src.start(); },
        play: function () { src.play(); }, pause: function () { src.pause(); },
        first: function () { src.first(); }, end: function () { src.finish(); }
      });
      btn.onclick = function () { if (src.playing) src.pause(); else src.play(); };
      document.getElementById('cBack').onclick = function () { src.back(); };
      document.getElementById('cNext').onclick = function () { src.next(); };
      document.getElementById('cRestart').onclick = function () { src.start(); };
      document.getElementById('cEnd').onclick = function () { src.finish(); };
      document.getElementById('cSpeed').value = String(src.speed);
      document.getElementById('cSpeed').onchange = function (e) { src.speed = Number(e.target.value); };
      document.getElementById('cAuto').checked = src.autoPause;
      document.getElementById('cAuto').onchange = function (e) { src.autoPause = e.target.checked; };
      // A recording opens paused on its first step, so a presenter can talk first and step with a
      // clicker (&play=1 plays it instead). A deep link: ?at=<node> opens paused where that step
      // stops (a sign-off at "waiting"), ?at=end at the end; &recap=1 then opens the recap.
      var at = q.get('at'), stop = at && at !== 'end' ? BenchLogic.stopAt(BenchLogic.sortEvents(events), bench.topo, at) : -1;
      if (at === 'end') src.finish();
      else if (stop >= 0) src.seek(stop);
      else if (q.get('play') === '1') src.start();
      else src.first();
      if (q.get('recap') === '1') bench.openRecap(true);
    }).catch(function (e) { fail('Could not load the recording: ' + e.message); });
  } else if (topoUrl) {
    getJSON(topoUrl).then(function (t) {
      if (t === null && q.get('app')) { var e404 = new Error('no map'); e404.status = 404; throw e404; }
      bench.setTopology(t);
      // A library app's map names its story by hash; the bench serves the trusted file only on a match.
      if (t.story) bench.loadStory(t.app.id, null, base, typeof t.story === 'object' ? t.story.sha256 : null);
      bench.useRunMaps(base);
      new BenchSources.LiveSource(bench, base, q.get('session'), q.get('app')).start();
    }).catch(function (e) {
      // Level 0: the app sends spans but never registered a map. Draw one from what arrives.
      if (e.status === 404 && q.get('app')) {
        bench.useInferredMap(q.get('app'));
        bench.useRunMaps(base);           // a run that does carry a map replaces the inferred one
        new BenchSources.LiveSource(bench, base, q.get('session'), q.get('app')).start();
      } else fail('Could not load the map for this app: ' + e.message + '. Has the app registered with the bench?');
    });
  } else {
    // No app named: list the apps that registered, plus recordings listed in recordings.json
    // (a static export has no receiver, so a failed /topologies just means "recordings only").
    Promise.all([
      getJSON(base + 'topologies').catch(function () { return null; }),
      getJSON(base + 'recordings.json').catch(function () { return []; })
    ]).then(function (res) {
      var apps = res[0], recs = res[1], esc = BenchLogic.esc;
      document.getElementById('bench').innerHTML = '<div id="picker"><p><a href="../">↑ Up</a></p><h3>Bench</h3>' +
        (apps ? '<p class="muted">Live, per registered app (add &amp;session=&lt;id&gt; to filter):</p>' +
          (apps.length ? apps.map(function (a) { return '<div><a href="?app=' + encodeURIComponent(a.id) + '">' + esc(a.name) + '</a>' + (a.story ? ' <span class="muted">· story</span>' : '') + (a.inferred ? ' <span class="muted">· no map registered: the bench infers one</span>' : '') + '</div>'; }).join('')
                       : '<div class="muted">none yet: an app registers with PUT /apps/&lt;id&gt;</div>') : '') +
        '<p class="muted" style="margin-top:16px">Recordings:</p>' +
        recs.map(function (r) { return '<div><a href="?replay=' + encodeURIComponent(r.path) + '">' + esc(r.title) + '</a>' + (r.group ? ' <span class="muted">· ' + esc(r.group) + '</span>' : '') + '</div>'; }).join('') + '</div>';
    });
  }

  /* "Try another request": the same app's other recordings, grouped and titled from their
     headers; and, for a run with a gate, the paired recording that went the other way. */
  function offerOthers(topo) {
    getJSON(base + 'recordings.json').catch(function () { return []; }).then(function (recs) {
      var mine = recs.filter(function (r) {
        return r.app ? r.app === topo.app.id : String(r.title || '').indexOf(topo.app.name + ' · ') === 0;
      }).map(function (r) {
        return { path: r.path, group: r.group || '', title: r.plain_title || String(r.title || r.path).replace(topo.app.name + ' · ', '') };
      });
      var cur = mine.filter(function (r) { return r.path === replay; })[0] ? replay : (mine.filter(function (r) { return replay.slice(-r.path.length) === r.path; })[0] || {}).path;
      // Another request starts at its own beginning: the step and recap of this one don't carry over.
      bench.setPicker(mine, cur, function (path) { location.search = withParams({ replay: path, at: null, recap: null }); });
      var m = /-(approved|denied)(\.recording\.jsonl)$/.exec(cur || replay);
      if (!m) return;
      var other = m[1] === 'approved' ? 'denied' : 'approved';
      var twin = (cur || replay).replace(m[0], '-' + other + m[2]);
      if (mine.some(function (r) { return r.path === twin; })) {
        bench.setPair({ href: withParams({ replay: twin, at: null, recap: null }), text: other === 'denied' ? 'See what happens if they deny ▸' : 'See what happens if they approve ▸' });
      }
    });
  }
})();
</script>
</body>
</html>
