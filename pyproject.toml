[project]
name = "agent-lab-bench"
version = "0.1.0"
description = "Agent Lab Bench: see inside any AI app while you use it."
license = "FSL-1.1-ALv2"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "opentelemetry-proto>=1.45",
    "starlette>=1.7.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.63.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
