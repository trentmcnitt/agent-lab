  <path d="M32 10 L54 54 L40 54 L32 36 L24 54 L10 54 Z" fill="#5eead4" fill-rule="evenodd" stroke="#5eead4" stroke-width="5" stroke-linejoin="round" filter="url(#al-glow)"/>
