  <defs>
    <linearGradient id="al-gv" gradientUnits="userSpaceOnUse" x1="32" y1="8" x2="32" y2="56"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#8fb8f0"/></linearGradient>
    <filter id="al-glow" filterUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
